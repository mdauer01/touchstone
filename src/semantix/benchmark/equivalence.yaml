# The semantix open equivalence benchmark.
#
# A verification engine's accuracy claims must be falsifiable, so the corpus
# the README quotes ships in the repo and `semantix bench` reproduces the
# numbers. Two case classes:
#
#   expect: equivalent — same math written differently. The engine should
#     prove sameness (hash-equal at proof grade). Misses are reported as the
#     detection rate; `known_gap: true` marks rewrites we knowingly do not
#     normalize yet — they degrade to a difference-HYPOTHESIS, which is the
#     safe direction (asymmetric equivalence, spec §3).
#
#   expect: different — near-misses that must NEVER hash-equal. A hit here is
#     a FALSE CERTIFICATION, the one failure class a verifier cannot survive;
#     the bench exits non-zero if any occur.
#
# Every SQL pair is a complete measure query over the shared catalog below.
# Each case runs under every dialect in the matrix (a case may scope itself
# with its own `dialects:` list); the gate must hold in every dialect.
version: 1
dialects: [duckdb, databricks, snowflake, bigquery]
catalog:
  raw:
    orders:
      order_id: bigint
      customer_id: bigint
      order_date: date
      status: varchar
      amount: "decimal(18,2)"
      refund_amount: "decimal(18,2)"
      channel: varchar
    refunds:
      refund_id: bigint
      order_id: bigint
      amt: "decimal(18,2)"
  analytics:
    fct_orders:
      order_id: bigint
      order_date: date
      status: varchar
      amount: "decimal(18,2)"
      refund_amount: "decimal(18,2)"
      channel: varchar

cases:
  - name: cte-inlining
    category: rewrite
    expect: equivalent
    a: |
      with base as (
          select order_date, amount, status from raw.orders
          where status = 'completed'
      )
      select sum(amount) as m from base
    b: |
      select sum(amount) as m from raw.orders where status = 'completed'

  - name: predicate-order
    category: normalization
    expect: equivalent
    a: "select sum(amount) as m from raw.orders where status = 'completed' and channel <> 'internal'"
    b: "select sum(amount) as m from raw.orders where channel <> 'internal' and status = 'completed'"

  - name: not-elimination
    category: normalization
    expect: equivalent
    a: "select sum(amount) as m from raw.orders where not status = 'cancelled'"
    b: "select sum(amount) as m from raw.orders where status <> 'cancelled'"

  - name: alias-renaming
    category: naming
    expect: equivalent
    a: "select sum(o.amount) as m from raw.orders as o where o.status = 'completed'"
    b: "select sum(ord.amount) as m from raw.orders as ord where ord.status = 'completed'"

  - name: select-star-expansion
    category: expansion
    expect: equivalent
    a: |
      select sum(amount) as m
      from (select * from raw.orders where status = 'completed') q
    b: "select sum(amount) as m from raw.orders where status = 'completed'"

  - name: group-by-ordinal
    category: normalization
    expect: equivalent
    a: |
      select date_trunc('month', order_date) as month, sum(amount) as m
      from raw.orders group by 1
    b: |
      select date_trunc('month', order_date) as month, sum(amount) as m
      from raw.orders group by date_trunc('month', order_date)

  - name: commutative-addition
    category: normalization
    expect: equivalent
    a: "select sum(amount + refund_amount) as m from raw.orders"
    b: "select sum(refund_amount + amount) as m from raw.orders"

  - name: between-vs-inequalities
    category: rewrite
    expect: equivalent
    a: "select sum(amount) as m from raw.orders where amount between 100 and 900"
    b: "select sum(amount) as m from raw.orders where amount >= 100 and amount <= 900"

  - name: equality-operand-flip
    category: normalization
    expect: equivalent
    a: "select sum(amount) as m from raw.orders where 'completed' = status"
    b: "select sum(amount) as m from raw.orders where status = 'completed'"

  - name: in-list-order
    category: normalization
    expect: equivalent
    known_gap: true
    note: >
      IN-list operand order is not yet normalized; the pair degrades to a
      difference-hypothesis rather than a false certification.
    a: "select sum(amount) as m from raw.orders where status in ('completed', 'pending')"
    b: "select sum(amount) as m from raw.orders where status in ('pending', 'completed')"

  - name: filter-widening
    category: near-miss
    expect: different
    a: "select sum(amount) as m from raw.orders where status = 'completed'"
    b: "select sum(amount) as m from raw.orders where status in ('completed', 'pending')"

  - name: expression-drops-refunds
    category: near-miss
    expect: different
    a: "select sum(amount - refund_amount) as m from raw.orders where status = 'completed'"
    b: "select sum(amount) as m from raw.orders where status = 'completed'"

  - name: source-table-swap
    category: near-miss
    expect: different
    a: "select sum(amount) as m from raw.orders where status = 'completed'"
    b: "select sum(amount) as m from analytics.fct_orders where status = 'completed'"

  - name: grain-change
    category: near-miss
    expect: different
    a: |
      select date_trunc('month', order_date) as p, sum(amount) as m
      from raw.orders group by 1
    b: |
      select date_trunc('week', order_date) as p, sum(amount) as m
      from raw.orders group by 1

  - name: literal-typo
    category: near-miss
    expect: different
    a: "select sum(amount) as m from raw.orders where status = 'completed'"
    b: "select sum(amount) as m from raw.orders where status = 'complete'"

  - name: conditional-agg-vs-filter
    category: near-miss
    expect: different
    note: >
      Totals coincide on any dataset, but the definitions differ statically
      (row universe and filters); the execution harness is what would refine
      this to value-equivalence.
    a: "select sum(case when status = 'x' then amount else 0 end) as m from raw.orders"
    b: "select sum(amount) as m from raw.orders where status = 'x'"

  # ---------------------------------------------------------------- v0.2
  # Every case below was found by an adversarial review of this engine on
  # 2026-07-25: each one FALSELY CERTIFIED before the completeness gate.
  # They exist because the original corpus only tested rewrites the author
  # had already thought of — a benchmark written by the implementer tests
  # the implementer's imagination, not the estate's SQL. These are the
  # constructs the SemanticCore did not model, and therefore silently
  # treated as identical.

  - name: cte-body-invisible
    category: near-miss
    expect: different
    note: >
      An aggregate inside a CTE blocks sqlglot's subquery merge, so the CTE
      survives as a relation named `base`. If the body is not folded into the
      core, two entirely unrelated measures over the same CTE name collide.
      This is the dominant dbt staging pattern.
    a: |
      with base as (
          select customer_id, sum(amount) as s from raw.orders
          where status = 'completed' group by 1)
      select sum(s) as m from base
    b: |
      with base as (
          select customer_id, sum(refund_amount) as s from raw.orders
          where status = 'cancelled' group by 1)
      select sum(s) as m from base

  - name: join-type-inner-vs-left
    category: near-miss
    expect: different
    note: >
      Same ON predicate, different row universe: INNER restricts to matched
      rows, LEFT keeps all. The single most common divergence between two
      teams' models of the same metric.
    a: "select sum(o.amount) as m from raw.orders o join raw.refunds r on o.order_id = r.order_id"
    b: "select sum(o.amount) as m from raw.orders o left join raw.refunds r on o.order_id = r.order_id"

  - name: having-restriction
    category: near-miss
    expect: different
    note: A post-aggregate filter restricts which groups survive; it is not neutral.
    a: |
      select customer_id, sum(amount) as m from raw.orders
      group by 1 having sum(amount) > 100
    b: "select customer_id, sum(amount) as m from raw.orders group by 1"

  - name: grouping-rollup-vs-ungrouped-total
    category: near-miss
    expect: different
    note: >
      ROLLUP/CUBE/GROUPING SETS live in their own arg on the Group node, not in
      group.expressions, so the grain read as EMPTY — making a subtotalled
      breakdown hash identically to a single grand total.
    a: |
      select status, channel, sum(amount) as m from raw.orders
      group by rollup(status, channel)
    b: "select sum(amount) as m from raw.orders"

  - name: grouping-sets-vs-flat
    category: near-miss
    expect: different
    note: Same cause as above; GROUPING SETS also emits an empty grain.
    a: |
      select status, sum(amount) as m from raw.orders
      group by grouping sets ((status), ())
    b: "select status, sum(amount) as m from raw.orders group by status"

  - name: select-distinct-row-dedup
    category: near-miss
    expect: different
    note: >
      Found while correcting this corpus, flagged by nothing else: SELECT
      DISTINCT de-duplicates the result set and was simply not read.
    a: "select distinct customer_id, sum(amount) as m from raw.orders group by 1"
    b: "select customer_id, sum(amount) as m from raw.orders group by 1"

  - name: limit-is-not-neutral
    category: near-miss
    expect: different
    note: >
      A bounded select is a different measure from an unbounded one. LIMIT was
      stripped as "semantics-neutral", which is only true for the ordering, and
      only when nothing is bounded.
    a: |
      select customer_id, sum(amount) as m from raw.orders
      group by 1 order by 2 desc limit 10
    b: "select customer_id, sum(amount) as m from raw.orders group by 1"

  - name: distinct-aggregate
    category: near-miss
    expect: different
    note: COUNT(DISTINCT x) and COUNT(x) answer different questions.
    a: "select count(distinct customer_id) as m from raw.orders"
    b: "select count(customer_id) as m from raw.orders"

  - name: cross-join-no-on-clause
    category: near-miss
    expect: different
    note: >
      A join carrying no ON predicate contributes no edge, so a cartesian
      product was indistinguishable from a single-table measure.
    a: "select sum(o.amount) as m from raw.orders o cross join raw.refunds r"
    b: "select sum(o.amount) as m from raw.orders o"
