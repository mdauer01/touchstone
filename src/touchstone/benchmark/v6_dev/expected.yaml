# Expected review state for each dev case, written from the statement and the dev
# definition (pilot/views/revenue_mv.yaml: its comments state the relationship facts and
# what nation and region mean), before any v6 verdict existed. Not labels from a person
# reviewing outputs: the target behavior applied to each statement, with the reason.
# harness.py challenges them by execution; a challenge that fails is a conflict to
# re-examine, never a silent change.
#
# review_needed     presented as revenue, computed differently from the definition
# could_not_assess  the result depends on a relationship fact the definition does not
#                   state (part and supplier are not declared; nothing says their keys
#                   match exactly once) - `violates` names the lookup to challenge
# no_issue_flagged  computed as defined, with legitimate variations; or not presented
#                   as revenue (a separately named quantity, or no revenue name at all)
#
# This set is DEV data: both earlier fresh tests, already seen. Nothing measured on it
# is a claim.

