family: long_longbi
split: test
items:
- id: longbi-01
  metric: net_revenue
  sql: |
    -- Looker Query Context '{"user_id":412,"history_slug":"8e1f0c2a9b","instance_slug":"f3a9c1d07e5b"}'
    -- explore: finance_core::revenue_overview   dashboard: 1187 "Revenue Overview (Monthly)"   tile: "Net revenue & customer mix by country"
    -- derived tables rendered inline (ephemeral): customer_facts, orders_monthly_rollup
    WITH customer_facts AS (
      -- view: customer_facts (sql_trigger_value: SELECT MAX(order_date) FROM main.finance.orders)
      SELECT
        cf_orders.customer_id                                   AS customer_id,
        MIN(cf_orders.order_date)                               AS first_completed_order_date,
        MAX(cf_orders.order_date)                               AS latest_completed_order_date,
        COUNT(DISTINCT cf_orders.order_id)                      AS lifetime_completed_orders,
        CASE
          WHEN COUNT(DISTINCT cf_orders.order_id) >= 10 THEN '10+'
          WHEN COUNT(DISTINCT cf_orders.order_id) >= 4  THEN '4-9'
          WHEN COUNT(DISTINCT cf_orders.order_id) >= 2  THEN '2-3'
          ELSE '1'
        END                                                     AS lifetime_order_tier
      FROM main.finance.orders AS cf_orders
      WHERE cf_orders.status = 'completed'
      GROUP BY 1
    ),
    customers AS (
      -- view: customers
      SELECT
        customers.customer_id                                   AS customer_id,
        customers.segment                                       AS segment,
        customers.region                                        AS region,
        CASE WHEN customers.segment IN ('enterprise', 'mid_market') THEN 'B2B' ELSE 'B2C' END AS business_type
      FROM main.finance.customers AS customers
    ),
    orders AS (
      -- view: orders  (sql_always_where: ${orders.status} = 'completed')
      SELECT
        orders.order_id                                         AS order_id,
        orders.customer_id                                      AS customer_id,
        orders.country                                          AS country,
        orders.channel                                          AS channel,
        orders.order_date                                       AS order_date,
        DATE_TRUNC('MONTH', orders.order_date)                  AS order_month,
        orders.amount                                           AS amount,
        orders.refund_amount                                    AS refund_amount,
        orders.discount                                         AS discount,
        CASE WHEN orders.refund_amount > 0 THEN 1 ELSE 0 END    AS has_refund
      FROM main.finance.orders AS orders
      WHERE (orders.status = 'completed')
        AND ((orders.order_date >= DATE '2025-07-01') AND (orders.order_date < DATE '2026-07-01'))
    ),
    orders_monthly_rollup AS (
      -- measure: orders.net_revenue  (type: number, sql: ${total_amount} - ${total_refunds})
      SELECT
        orders.country                                          AS country,
        orders.order_month                                      AS order_month,
        SUM(orders.amount) - SUM(orders.refund_amount)          AS net_revenue,
        COUNT(DISTINCT orders.order_id)                         AS order_count,
        SUM(orders.has_refund)                                  AS refunded_order_lines,
        SUM(orders.discount)                                    AS total_discount
      FROM orders
      GROUP BY 1, 2
    ),
    customer_mix AS (
      -- fanout-safe: distinct counts only, joined back on the explore grain
      SELECT
        orders.country                                          AS country,
        orders.order_month                                      AS order_month,
        COUNT(DISTINCT orders.customer_id)                      AS active_customers,
        COUNT(DISTINCT CASE
          WHEN customer_facts.first_completed_order_date >= orders.order_month
           AND customer_facts.first_completed_order_date <  orders.order_month + INTERVAL 1 MONTH
          THEN orders.customer_id END)                          AS new_customers,
        COUNT(DISTINCT CASE WHEN customers.business_type = 'B2B' THEN orders.customer_id END) AS b2b_customers,
        COUNT(DISTINCT CASE WHEN customer_facts.lifetime_order_tier = '10+' THEN orders.customer_id END) AS power_customers,
        COUNT(DISTINCT CASE WHEN customers.customer_id IS NULL THEN orders.customer_id END) AS unmatched_customers
      FROM orders
      LEFT JOIN customer_facts ON customer_facts.customer_id = orders.customer_id
      LEFT JOIN customers ON customers.customer_id = orders.customer_id
      GROUP BY 1, 2
    )
    SELECT
      orders_monthly_rollup.country                             AS orders_country,
      orders_monthly_rollup.order_month                         AS orders_order_month,
      orders_monthly_rollup.net_revenue                         AS orders_net_revenue,
      orders_monthly_rollup.order_count                         AS orders_count,
      orders_monthly_rollup.net_revenue
        / NULLIF(orders_monthly_rollup.order_count, 0)          AS orders_net_aov,
      orders_monthly_rollup.total_discount                      AS orders_total_discount,
      orders_monthly_rollup.refunded_order_lines                AS orders_refunded_count,
      customer_mix.active_customers                             AS customers_active_count,
      customer_mix.new_customers                                AS customers_new_count,
      customer_mix.b2b_customers                                AS customers_b2b_count,
      customer_mix.power_customers                              AS customers_power_count,
      customer_mix.unmatched_customers                          AS customers_unmatched_count,
      CASE
        WHEN customer_mix.active_customers IS NULL OR customer_mix.active_customers = 0 THEN NULL
        ELSE CAST(customer_mix.new_customers AS DOUBLE) / customer_mix.active_customers
      END                                                       AS customers_new_share
    FROM orders_monthly_rollup
    LEFT JOIN customer_mix
      ON customer_mix.country = orders_monthly_rollup.country
     AND customer_mix.order_month = orders_monthly_rollup.order_month
    ORDER BY 2 DESC, 3 DESC
  label: permitted_variation
  rationale: 'Looker explore query with two ephemeral derived tables. orders_net_revenue comes from orders_monthly_rollup, which reads only the `orders` CTE: main.finance.orders filtered to status = ''completed'' plus an order_date window (a declared-dimension time filter), grouped by country and DATE_TRUNC(''MONTH'', order_date) (the declared month), with SUM(amount) - SUM(refund_amount). The customer_facts / customers LEFT JOINs live only in customer_mix, which computes distinct customer counts, is pre-aggregated to the same (country, order_month) grain and is LEFT JOINed back from the revenue side, so it cannot add, drop or duplicate revenue rows. NULL-refund groups keep the declared NULL semantics.'
  counterpart_sql: |
    SELECT
      country AS orders_country,
      DATE_TRUNC('MONTH', order_date) AS orders_order_month,
      SUM(amount) - SUM(refund_amount) AS orders_net_revenue
    FROM main.finance.orders
    WHERE status = 'completed'
      AND order_date >= DATE '2025-07-01' AND order_date < DATE '2026-07-01'
    GROUP BY 1, 2
  key_columns:
  - orders_country
  - orders_order_month
  metric_column: orders_net_revenue
- id: longbi-02
  metric: net_revenue
  sql: |
    -- Looker Query Context '{"user_id":288,"history_slug":"c41b7aa0e2","instance_slug":"f3a9c1d07e5b"}'
    -- explore: finance_core::orders_pricing   dashboard: 1203 "Monthly Net Revenue - Pricing Lens"   tile: "Net revenue, discount depth by country"
    -- derived tables rendered inline (ephemeral): stg_orders, orders_priced, orders_attributed, pricing_rollup
    WITH stg_orders AS (
      -- view: stg_orders (sql_always_where: ${stg_orders.status} = 'completed')
      SELECT
        o.order_id                                              AS order_id,
        o.customer_id                                           AS customer_id,
        o.country                                               AS country,
        o.channel                                               AS channel,
        o.order_date                                            AS order_date,
        o.amount                                                AS amount,
        o.refund_amount                                         AS refund_amount,
        o.discount                                              AS discount
      FROM main.finance.orders AS o
      WHERE o.status = 'completed'
        AND o.order_date >= DATE '2026-01-01'
        AND o.order_date <  DATE '2026-07-01'
    ),
    orders_priced AS (
      -- view: orders_priced  (list price reconstructed from net charge + discount)
      SELECT
        stg_orders.*,
        DATE_TRUNC('MONTH', stg_orders.order_date)              AS order_month,
        stg_orders.amount + COALESCE(stg_orders.discount, 0)    AS list_amount,
        COALESCE(stg_orders.discount, 0)
          / NULLIF(stg_orders.amount + COALESCE(stg_orders.discount, 0), 0) AS discount_rate,
        CASE
          WHEN stg_orders.discount IS NULL               THEN 'unknown'
          WHEN stg_orders.discount <= 0                  THEN 'none'
          WHEN stg_orders.discount < 10                  THEN 'light'
          WHEN stg_orders.discount < 25                  THEN 'standard'
          ELSE 'deep'
        END                                                     AS discount_band
      FROM stg_orders
    ),
    orders_attributed AS (
      -- view: orders_attributed  (price-book attribution; joins to promo calendar resolved in LookML)
      SELECT
        orders_priced.order_id,
        orders_priced.customer_id,
        orders_priced.country,
        orders_priced.channel,
        orders_priced.order_date,
        orders_priced.order_month,
        orders_priced.amount,
        orders_priced.refund_amount,
        orders_priced.discount,
        orders_priced.list_amount,
        orders_priced.discount_rate,
        orders_priced.discount_band,
        CASE WHEN orders_priced.discount_rate >= 0.2 THEN TRUE ELSE FALSE END AS is_deep_discount
      FROM orders_priced
      WHERE orders_priced.discount_band IN ('light', 'standard', 'deep')
    ),
    pricing_rollup AS (
      SELECT
        orders_attributed.country                               AS country,
        orders_attributed.order_month                           AS order_month,
        SUM(orders_attributed.amount)
          - SUM(orders_attributed.refund_amount)                AS net_revenue,
        SUM(orders_attributed.list_amount)                      AS list_revenue,
        SUM(orders_attributed.discount)                         AS discount_total,
        COUNT(DISTINCT orders_attributed.order_id)              AS order_count,
        COUNT(DISTINCT CASE WHEN orders_attributed.is_deep_discount THEN orders_attributed.order_id END) AS deep_discount_orders,
        AVG(orders_attributed.discount_rate)                    AS avg_discount_rate
      FROM orders_attributed
      GROUP BY 1, 2
    ),
    band_counts AS (
      SELECT
        orders_priced.country                                   AS country,
        orders_priced.order_month                               AS order_month,
        COUNT(DISTINCT CASE WHEN orders_priced.discount_band = 'none'     THEN orders_priced.order_id END) AS orders_band_none,
        COUNT(DISTINCT CASE WHEN orders_priced.discount_band = 'light'    THEN orders_priced.order_id END) AS orders_band_light,
        COUNT(DISTINCT CASE WHEN orders_priced.discount_band = 'standard' THEN orders_priced.order_id END) AS orders_band_standard,
        COUNT(DISTINCT CASE WHEN orders_priced.discount_band = 'deep'     THEN orders_priced.order_id END) AS orders_band_deep
      FROM orders_priced
      GROUP BY 1, 2
    )
    SELECT
      pricing_rollup.country                                    AS orders_country,
      pricing_rollup.order_month                                AS orders_order_month,
      pricing_rollup.net_revenue                                AS orders_net_revenue,
      pricing_rollup.list_revenue                               AS orders_list_revenue,
      pricing_rollup.discount_total                             AS orders_discount_total,
      pricing_rollup.discount_total
        / NULLIF(pricing_rollup.list_revenue, 0)                AS orders_effective_discount_rate,
      pricing_rollup.avg_discount_rate                          AS orders_avg_discount_rate,
      pricing_rollup.order_count                                AS orders_count,
      pricing_rollup.deep_discount_orders                       AS orders_deep_discount_count,
      band_counts.orders_band_none                              AS orders_band_none_count,
      band_counts.orders_band_light                             AS orders_band_light_count,
      band_counts.orders_band_standard                          AS orders_band_standard_count,
      band_counts.orders_band_deep                              AS orders_band_deep_count,
      RANK() OVER (
        PARTITION BY pricing_rollup.order_month
        ORDER BY pricing_rollup.net_revenue DESC NULLS LAST
      )                                                         AS orders_country_rank_in_month
    FROM pricing_rollup
    LEFT JOIN band_counts
      ON band_counts.country = pricing_rollup.country
     AND band_counts.order_month = pricing_rollup.order_month
    ORDER BY 2, 14
  label: population_drift
  rationale: The revenue rollup reads orders_attributed, which is three CTEs down from the source (stg_orders -> orders_priced -> orders_attributed). It keeps only discount_band IN ('light','standard','deep'). discount_band is 'none' when discount <= 0 and 'unknown' when discount is NULL, so full-price completed orders are silently excluded from orders_net_revenue. That is a filter on discount, which is not a declared dimension, so the population changes. The status filter, formula, month grouping and time window are otherwise correct, and the band_counts CTE, which does see all orders, feeds only the band count columns.
  counterpart_sql: |
    SELECT
      country AS orders_country,
      DATE_TRUNC('MONTH', order_date) AS orders_order_month,
      SUM(amount) - SUM(refund_amount) AS orders_net_revenue
    FROM main.finance.orders
    WHERE status = 'completed'
      AND order_date >= DATE '2026-01-01' AND order_date < DATE '2026-07-01'
    GROUP BY 1, 2
  key_columns:
  - orders_country
  - orders_order_month
  metric_column: orders_net_revenue
- id: longbi-03
  metric: gross_revenue
  sql: |
    /* Tableau Server 2026.2 | workbook: "Channel Scorecard" | sheet: "Gross by Country x Channel" | datasource: "Finance Orders (custom SQL) + Customers (relationship)" */
    SELECT
      t0.country                                   AS country,
      t0.channel                                   AS channel,
      t0.sum_amount_ok                             AS sum_gross_revenue_ok,
      t0.cnt_order_id_ok                           AS cnt_orders_ok,
      t0.sum_large_orders_ok                       AS sum_large_orders_ok,
      t0.sum_discount_ok                           AS sum_discount_ok,
      t1.ctd_customer_id_ok                        AS ctd_customers_ok,
      t1.ctd_enterprise_customer_ok                AS ctd_enterprise_customers_ok,
      t1.ctd_emea_customer_ok                      AS ctd_emea_customers_ok,
      t2.fixed_country_amount                      AS lod_country_amount,
      t0.sum_amount_ok / NULLIF(t2.fixed_country_amount, 0) AS calc_share_of_country,
      t0.sum_amount_ok / NULLIF(t0.cnt_order_id_ok, 0)      AS calc_aov
    FROM (
      SELECT
        Custom_SQL_Query.country                   AS country,
        Custom_SQL_Query.channel                   AS channel,
        SUM(Custom_SQL_Query.amount)               AS sum_amount_ok,
        COUNT(Custom_SQL_Query.order_id)           AS cnt_order_id_ok,
        SUM(CASE WHEN Custom_SQL_Query.order_size_band = 'Large' THEN 1 ELSE 0 END) AS sum_large_orders_ok,
        SUM(Custom_SQL_Query.discount)             AS sum_discount_ok
      FROM (
        -- custom SQL (published datasource "Finance Orders")
        SELECT
          o.order_id,
          o.customer_id,
          o.country,
          o.channel,
          o.order_date,
          o.amount,
          o.refund_amount,
          o.discount,
          CASE
            WHEN o.amount >= 250 THEN 'Large'
            WHEN o.amount >= 75  THEN 'Medium'
            ELSE 'Small'
          END AS order_size_band
        FROM main.finance.orders o
        WHERE o.status = 'completed'
      ) Custom_SQL_Query
      WHERE ((Custom_SQL_Query.order_date >= DATE '2026-01-01') AND (Custom_SQL_Query.order_date <= DATE '2026-09-30'))
        AND ((Custom_SQL_Query.channel NOT IN ('internal')) OR (Custom_SQL_Query.channel IS NULL))
      GROUP BY 1, 2
    ) t0
    LEFT JOIN (
      -- relationship Finance Orders.customer_id = Customers.customer_id, evaluated at Customers level of detail
      SELECT
        Custom_SQL_Query.country                   AS country,
        Custom_SQL_Query.channel                   AS channel,
        COUNT(DISTINCT customers.customer_id)      AS ctd_customer_id_ok,
        COUNT(DISTINCT CASE WHEN customers.segment = 'enterprise' THEN customers.customer_id END) AS ctd_enterprise_customer_ok,
        COUNT(DISTINCT CASE WHEN customers.region = 'EMEA' THEN customers.customer_id END)        AS ctd_emea_customer_ok
      FROM (
        SELECT
          o.order_id,
          o.customer_id,
          o.country,
          o.channel,
          o.order_date,
          o.amount,
          o.refund_amount,
          o.discount,
          CASE
            WHEN o.amount >= 250 THEN 'Large'
            WHEN o.amount >= 75  THEN 'Medium'
            ELSE 'Small'
          END AS order_size_band
        FROM main.finance.orders o
        WHERE o.status = 'completed'
      ) Custom_SQL_Query
      INNER JOIN main.finance.customers customers
        ON (Custom_SQL_Query.customer_id = customers.customer_id)
      WHERE ((Custom_SQL_Query.order_date >= DATE '2026-01-01') AND (Custom_SQL_Query.order_date <= DATE '2026-09-30'))
        AND ((Custom_SQL_Query.channel NOT IN ('internal')) OR (Custom_SQL_Query.channel IS NULL))
      GROUP BY 1, 2
    ) t1
      ON (((t0.country = t1.country) OR ((t0.country IS NULL) AND (t1.country IS NULL)))
      AND ((t0.channel = t1.channel) OR ((t0.channel IS NULL) AND (t1.channel IS NULL))))
    LEFT JOIN (
      -- LOD: { FIXED [country] : SUM([amount]) }  (context filters applied)
      SELECT
        Custom_SQL_Query.country                   AS country,
        SUM(Custom_SQL_Query.amount)               AS fixed_country_amount
      FROM (
        SELECT o.order_id, o.country, o.channel, o.order_date, o.amount
        FROM main.finance.orders o
        WHERE o.status = 'completed'
      ) Custom_SQL_Query
      WHERE ((Custom_SQL_Query.order_date >= DATE '2026-01-01') AND (Custom_SQL_Query.order_date <= DATE '2026-09-30'))
        AND ((Custom_SQL_Query.channel NOT IN ('internal')) OR (Custom_SQL_Query.channel IS NULL))
      GROUP BY 1
    ) t2
      ON ((t0.country = t2.country) OR ((t0.country IS NULL) AND (t2.country IS NULL)))
    ORDER BY 1 ASC NULLS FIRST, 2 ASC NULLS FIRST
  label: permitted_variation
  rationale: Tableau relationship query. sum_gross_revenue_ok is t0.sum_amount_ok, which is SUM(amount) over the custom SQL (main.finance.orders WHERE status = 'completed') with Tableau-generated filters on order_date (a declared time window) and channel (NOT IN ('internal') OR IS NULL, a declared dimension), grouped by country and channel. The customers relationship (t1, an INNER JOIN to customers) and the FIXED-country LOD (t2) are separate subqueries, each aggregated to a grain that is unique on the join keys and joined NULL-safely from t0. They feed only the customer-count, share and AOV columns and cannot change t0's rows.
  counterpart_sql: |
    SELECT
      country,
      channel,
      SUM(amount) AS sum_gross_revenue_ok
    FROM main.finance.orders
    WHERE status = 'completed'
      AND order_date >= DATE '2026-01-01' AND order_date <= DATE '2026-09-30'
      AND (channel NOT IN ('internal') OR channel IS NULL)
    GROUP BY 1, 2
  key_columns:
  - country
  - channel
  metric_column: sum_gross_revenue_ok
- id: longbi-04
  metric: net_revenue
  sql: |
    -- Power BI DirectQuery | dataset: "Finance Ops Model" | report: "Monthly Revenue & Units" | visual: matrix (country x month)
    -- ActivityId: 4b1f9c2e-77d0-4a51-9a38-0c2f5e8d1a63
    select
      _out.country                as country,
      _out.order_month            as order_month,
      _out.a0                     as net_revenue,
      _out.a1                     as units_sold,
      _out.a2                     as distinct_orders,
      _out.a3                     as distinct_skus,
      _out.a4                     as refunded_orders,
      case when _out.a2 = 0 then null else _out.a0 / _out.a2 end as net_revenue_per_order,
      case when _out.a2 = 0 then null else cast(_out.a1 as double) / _out.a2 end as units_per_order
    from
    (
      select
        _grp.country              as country,
        _grp.order_month          as order_month,
        sum(_grp.amount) - sum(_grp.refund_amount) as a0,
        sum(_grp.qty)             as a1,
        count(distinct _grp.order_id) as a2,
        count(distinct _grp.sku)  as a3,
        count(distinct case when _grp.refund_amount > 0 then _grp.order_id end) as a4
      from
      (
        select
          _flt.order_id           as order_id,
          _flt.country            as country,
          _flt.order_month        as order_month,
          _flt.amount             as amount,
          _flt.refund_amount      as refund_amount,
          _flt.sku                as sku,
          _flt.qty                as qty
        from
        (
          select
            _ord.order_id         as order_id,
            _ord.customer_id      as customer_id,
            _ord.country          as country,
            _ord.channel          as channel,
            _ord.order_date       as order_date,
            _ord.order_month      as order_month,
            _ord.amount           as amount,
            _ord.refund_amount    as refund_amount,
            _ord.discount         as discount,
            _ord.status           as status,
            _ord.sku              as sku,
            _ord.qty              as qty
          from
          (
            -- Power Query folded source for table 'Orders' (Navigation -> Merged Queries -> Expanded order_items -> Added Custom)
            select
              _o.order_id         as order_id,
              _o.customer_id      as customer_id,
              _o.country          as country,
              _o.channel          as channel,
              _o.order_date       as order_date,
              date_trunc('MONTH', _o.order_date) as order_month,
              _o.amount           as amount,
              _o.refund_amount    as refund_amount,
              _o.discount         as discount,
              _o.status           as status,
              _oi.sku             as sku,
              _oi.qty             as qty
            from main.finance.orders as _o
            inner join main.finance.order_items as _oi
              on _o.order_id = _oi.order_id
          ) as _ord
          where _ord.status = 'completed'
        ) as _flt
        where (_flt.order_date >= DATE '2026-01-01' and _flt.order_date < DATE '2026-10-01')
          and (_flt.country in ('US', 'CA', 'GB', 'DE', 'FR'))
      ) as _grp
      group by
        _grp.country,
        _grp.order_month
    ) as _out
    where not _out.a0 is null
       or not _out.a1 is null
       or not _out.a2 is null
    order by _out.country, _out.order_month
    limit 1000001
  label: source_drift
  rationale: Power BI DirectQuery nests five subqueries. The innermost one is the folded Power Query source for the 'Orders' table, and it INNER JOINs main.finance.orders to main.finance.order_items so that the Units measure can read qty. Every later level, including the a0 = sum(amount) - sum(refund_amount) aggregation, reads that merged row set. An order's amount and refund_amount are therefore repeated once per item row, and orders with no items are dropped. The governed metric is computed over a different relation whose rows can multiply or disappear. The status filter, formula text, month grouping and declared-dimension filters (order_date window, country IN list) are otherwise correct.
  counterpart_sql: |
    SELECT
      country,
      DATE_TRUNC('MONTH', order_date) AS order_month,
      SUM(amount) - SUM(refund_amount) AS net_revenue
    FROM main.finance.orders
    WHERE status = 'completed'
      AND order_date >= DATE '2026-01-01' AND order_date < DATE '2026-10-01'
      AND country IN ('US', 'CA', 'GB', 'DE', 'FR')
    GROUP BY 1, 2
  key_columns:
  - country
  - order_month
  metric_column: net_revenue
- id: longbi-05
  metric: net_revenue
  sql: |
    -- Power BI DirectQuery | dataset: "Finance Ops Model" | report: "Daily Trading" | visual: table (country, order_date) with slicers channel, date range
    -- ActivityId: 9a07e3d1-2c4b-4f6e-b0a8-71d55c3e2f90
    select
      basetable0.c11                        as country,
      basetable0.c12                        as order_date,
      basetable0.a0 - basetable0.a1         as net_revenue,
      basetable0.a0                         as amount_total,
      basetable0.a1                         as refund_total,
      basetable0.a2                         as order_count,
      semijoin1.a3                          as distinct_customers,
      semijoin1.a4                          as enterprise_customers,
      semijoin1.a5                          as unmatched_customer_orders,
      semijoin2.a6                          as units_sold,
      semijoin2.a7                          as distinct_skus,
      case
        when basetable0.a2 = 0 then null
        else (basetable0.a0 - basetable0.a1) / basetable0.a2
      end                                   as net_revenue_per_order,
      case
        when semijoin2.a6 is null or semijoin2.a6 = 0 then null
        else basetable0.a0 / semijoin2.a6
      end                                   as gross_per_unit
    from
    (
      select
        t1.country                          as c11,
        t1.order_date                       as c12,
        sum(t1.amount)                      as a0,
        sum(t1.refund_amount)               as a1,
        count(t1.order_id)                  as a2
      from
      (
        select
          t0.order_id, t0.customer_id, t0.country, t0.channel, t0.order_date, t0.amount, t0.refund_amount, t0.discount
        from
        (
          select
            o.order_id, o.customer_id, o.country, o.channel, o.order_date, o.amount, o.refund_amount, o.discount, o.status
          from main.finance.orders as o
          where o.status = 'completed'
        ) as t0
        where t0.channel in ('web', 'app')
          and t0.order_date >= DATE '2026-09-01'
          and t0.order_date <  DATE '2026-10-01'
      ) as t1
      group by t1.country, t1.order_date
    ) as basetable0
    left outer join
    (
      select
        t3.country                          as c11,
        t3.order_date                       as c12,
        count(distinct t3.customer_id)      as a3,
        count(distinct case when c.segment = 'enterprise' then t3.customer_id end) as a4,
        count(case when c.customer_id is null then t3.order_id end)                as a5
      from
      (
        select o.order_id, o.customer_id, o.country, o.channel, o.order_date
        from main.finance.orders as o
        where o.status = 'completed'
          and o.channel in ('web', 'app')
          and o.order_date >= DATE '2026-09-01'
          and o.order_date <  DATE '2026-10-01'
      ) as t3
      left outer join main.finance.customers as c
        on t3.customer_id = c.customer_id
      group by t3.country, t3.order_date
    ) as semijoin1
      on ((basetable0.c11 = semijoin1.c11) or (basetable0.c11 is null and semijoin1.c11 is null))
     and ((basetable0.c12 = semijoin1.c12) or (basetable0.c12 is null and semijoin1.c12 is null))
    left outer join
    (
      select
        t5.country                          as c11,
        t5.order_date                       as c12,
        sum(oi.qty)                         as a6,
        count(distinct oi.sku)              as a7
      from
      (
        select o.order_id, o.country, o.channel, o.order_date
        from main.finance.orders as o
        where o.status = 'completed'
          and o.channel in ('web', 'app')
          and o.order_date >= DATE '2026-09-01'
          and o.order_date <  DATE '2026-10-01'
      ) as t5
      inner join main.finance.order_items as oi
        on t5.order_id = oi.order_id
      group by t5.country, t5.order_date
    ) as semijoin2
      on ((basetable0.c11 = semijoin2.c11) or (basetable0.c11 is null and semijoin2.c11 is null))
     and ((basetable0.c12 = semijoin2.c12) or (basetable0.c12 is null and semijoin2.c12 is null))
    where not basetable0.a0 is null
       or not basetable0.a1 is null
       or not basetable0.a2 is null
    order by basetable0.c11, basetable0.c12
    limit 1000001
  label: permitted_variation
  rationale: Power BI basetable0 computes a0 = sum(amount) and a1 = sum(refund_amount) per (country, order_date) over completed orders. It filters on channel IN ('web','app') and an order_date window, both declared dimensions. The outer select returns a0 - a1, which is exactly SUM(amount) - SUM(refund_amount) at the group grain, including NULL when every refund in the group is NULL. semijoin1 (customers) and semijoin2 (order_items) are each aggregated to (country, order_date) and NULL-safely LEFT JOINed, so they feed only their own columns. The trailing `where not a0 is null or not a1 is null or not a2 is null` cannot drop a group, because a2 is a COUNT and is never NULL. The LIMIT sits under an ORDER BY on the unique group keys.
