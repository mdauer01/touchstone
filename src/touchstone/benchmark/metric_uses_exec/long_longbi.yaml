  - channel
  - month
  metric_column: net_revenue
- id: longbi-09
  metric: net_revenue
  sql: |
    -- Hex | project: "FY26 Country x Channel Review" | cell: "net_by_country_channel" (SQL, connection: databricks-finance-prod)
    -- rendered Jinja params: fy_start = '2025-10-01', fy_end = '2026-09-30', channels = ['web', 'app', 'retail']
    -- upstream cells inlined: all_orders, completed_orders, order_status_mix, first_orders, customer_regions
    WITH all_orders AS (
      -- cell: all_orders  (every status; used for the status-mix columns only)
      SELECT
        o.order_id,
        o.customer_id,
        o.country,
        o.channel,
        o.order_date,
        o.status,
        o.amount,
        o.refund_amount,
        o.discount
      FROM main.finance.orders AS o
      WHERE o.order_date BETWEEN DATE '2025-10-01' AND DATE '2026-09-30'
        AND o.channel IN ('web', 'app', 'retail')
    ),
    completed_orders AS (
      -- cell: completed_orders
      SELECT
        all_orders.*
      FROM all_orders
      WHERE all_orders.status = 'completed'
    ),
    order_status_mix AS (
      -- cell: order_status_mix
      SELECT
        all_orders.country,
        all_orders.channel,
        COUNT(*)                                                      AS orders_all_statuses,
        SUM(CASE WHEN all_orders.status = 'cancelled' THEN 1 ELSE 0 END) AS cancelled_orders,
        SUM(CASE WHEN all_orders.status = 'pending'   THEN 1 ELSE 0 END) AS pending_orders,
        SUM(CASE WHEN all_orders.status = 'completed' THEN 1 ELSE 0 END) AS completed_orders,
        SUM(CASE WHEN all_orders.status = 'cancelled' THEN all_orders.amount END) AS cancelled_amount
      FROM all_orders
      GROUP BY all_orders.country, all_orders.channel
    ),
    first_orders AS (
      -- cell: first_orders  (customer's first completed order inside the window)
      SELECT
        completed_orders.customer_id,
        completed_orders.order_id     AS first_order_id,
        completed_orders.channel      AS first_channel,
        completed_orders.order_date   AS first_order_date
      FROM completed_orders
      QUALIFY ROW_NUMBER() OVER (
        PARTITION BY completed_orders.customer_id
        ORDER BY completed_orders.order_date, completed_orders.order_id
      ) = 1
    ),
    customer_regions AS (
      -- cell: customer_regions
      SELECT
        co.country,
        co.channel,
        COUNT(DISTINCT co.customer_id)                                                  AS customers,
        COUNT(DISTINCT CASE WHEN fo.first_channel = co.channel THEN co.customer_id END) AS customers_acquired_here,
        COUNT(DISTINCT CASE WHEN cu.region = 'NA'   THEN co.customer_id END)            AS customers_na,
        COUNT(DISTINCT CASE WHEN cu.region = 'EMEA' THEN co.customer_id END)            AS customers_emea,
        COUNT(DISTINCT CASE WHEN cu.region IS NULL  THEN co.customer_id END)            AS customers_no_region
      FROM completed_orders AS co
      LEFT JOIN first_orders AS fo
        ON fo.customer_id = co.customer_id
      LEFT JOIN main.finance.customers AS cu
        ON cu.customer_id = co.customer_id
      GROUP BY co.country, co.channel
    ),
    net_by_country_channel AS (
      -- cell: net_by_country_channel (core measure, matches finance definition)
      SELECT
        completed_orders.country,
        completed_orders.channel,
        SUM(completed_orders.amount) - SUM(completed_orders.refund_amount)   AS net_revenue,
        SUM(completed_orders.amount)                                          AS amount_total,
        SUM(completed_orders.refund_amount)                                   AS refund_total,
        COUNT(*)                                                              AS order_count,
        AVG(completed_orders.discount)                                        AS avg_discount
      FROM completed_orders
      GROUP BY completed_orders.country, completed_orders.channel
    )
    SELECT
      n.country,
      n.channel,
      n.net_revenue,
      n.amount_total,
      n.refund_total,
      n.order_count,
      n.avg_discount,
      n.net_revenue / NULLIF(n.order_count, 0)                                 AS net_per_order,
      m.orders_all_statuses,
      m.cancelled_orders,
      m.pending_orders,
      CAST(m.cancelled_orders AS DOUBLE)
        / NULLIF(m.cancelled_orders + m.completed_orders, 0)                   AS cancel_rate,
      m.cancelled_amount,
      r.customers,
      r.customers_acquired_here,
      r.customers_na,
      r.customers_emea,
      r.customers_no_region,
      NTILE(4) OVER (ORDER BY n.net_revenue DESC NULLS LAST, n.country, n.channel) AS net_quartile,
      CASE
        WHEN n.net_revenue IS NULL THEN 'no refunds recorded'
        WHEN n.net_revenue < 0     THEN 'net negative'
        ELSE 'ok'
      END                                                                      AS review_flag
    FROM net_by_country_channel AS n
    LEFT JOIN order_status_mix AS m
      ON m.country IS NOT DISTINCT FROM n.country
     AND m.channel = n.channel
    LEFT JOIN customer_regions AS r
      ON r.country IS NOT DISTINCT FROM n.country
     AND r.channel = n.channel
    ORDER BY n.country NULLS LAST, n.channel
  label: permitted_variation
  rationale: net_revenue is computed in net_by_country_channel over completed_orders, which is all_orders filtered by order_date BETWEEN a fixed window and channel IN ('web','app','retail') (both declared dimensions) and then status = 'completed'. The aggregation is SUM(amount) - SUM(refund_amount) grouped by country and channel. The non-completed rows in all_orders feed only order_status_mix (cancel and pending counts). The customers and first_orders joins feed only customer_regions. Both are aggregated per (country, channel) and LEFT JOINed back. NTILE and the review flag only add columns.
  counterpart_sql: |
    SELECT
      country,
      channel,
      SUM(amount) - SUM(refund_amount) AS net_revenue
    FROM main.finance.orders
    WHERE status = 'completed'
      AND order_date BETWEEN DATE '2025-10-01' AND DATE '2026-09-30'
      AND channel IN ('web', 'app', 'retail')
    GROUP BY 1, 2
  key_columns:
  - country
  - channel
  metric_column: net_revenue
- id: longbi-10
  metric: gross_revenue
  sql: |
    -- Looker Query Context '{"user_id":97,"history_slug":"5d02e6b1f4","instance_slug":"f3a9c1d07e5b"}'
    -- explore: finance_core::revenue_overview   dashboard: 1191 "Country Targets (Monthly)"   tile: "Gross revenue vs target"
    -- aggregate awareness: query rewritten to aggregate_table orders::rollup__country__channel__period (looker_scratch, rendered inline below)
    WITH rollup__country__channel__period AS (
      -- aggregate_table: rollup__country__channel__period
      --   query: dimensions [orders.country, orders.channel, orders.created_period], measures [orders.gross_revenue, orders.count, orders.total_discount]
      --   materialization: datagroup finance_daily
      SELECT
        orders.country                                          AS orders_country,
        orders.channel                                          AS orders_channel,
        DATE_TRUNC('WEEK', orders.order_date)                   AS orders_created_period,
        SUM(orders.amount)                                      AS orders_gross_revenue,
        COUNT(*)                                                AS orders_count,
        SUM(orders.discount)                                    AS orders_total_discount,
        SUM(CASE WHEN orders.refund_amount > 0 THEN 1 ELSE 0 END) AS orders_refunded_count
      FROM main.finance.orders AS orders
      WHERE (orders.status = 'completed')
      GROUP BY 1, 2, 3
    ),
    country_targets AS (
      -- view: country_targets (derived_table sql maintained by FP&A)
      SELECT 'US' AS country, 42000.0 AS monthly_gross_target UNION ALL
      SELECT 'CA', 9000.0  UNION ALL
      SELECT 'GB', 11000.0 UNION ALL
      SELECT 'DE', 10500.0 UNION ALL
      SELECT 'FR', 8000.0  UNION ALL
      SELECT 'MX', 5000.0
    ),
    monthly AS (
      SELECT
        agg.orders_country                                   AS orders_country,
        DATE_TRUNC('MONTH', agg.orders_created_period)       AS orders_order_month,
        SUM(agg.orders_gross_revenue)                        AS orders_gross_revenue,
        SUM(agg.orders_count)                                AS orders_count,
        SUM(agg.orders_total_discount)                       AS orders_total_discount,
        SUM(agg.orders_refunded_count)                       AS orders_refunded_count,
        COUNT(DISTINCT agg.orders_channel)                   AS orders_active_channels,
        SUM(CASE WHEN agg.orders_channel IN ('web', 'app') THEN agg.orders_gross_revenue ELSE 0 END) AS orders_digital_gross
      FROM rollup__country__channel__period AS agg
      WHERE (agg.orders_country IN ('US', 'CA', 'GB', 'DE', 'FR', 'MX'))
      GROUP BY 1, 2
    ),
    monthly_with_targets AS (
      SELECT
        monthly.*,
        country_targets.monthly_gross_target                    AS country_targets_monthly_gross_target,
        LAG(monthly.orders_gross_revenue, 12) OVER (
          PARTITION BY monthly.orders_country
          ORDER BY monthly.orders_order_month
        )                                                       AS orders_gross_revenue_prior_year_row,
        SUM(monthly.orders_gross_revenue) OVER (
          PARTITION BY monthly.orders_country, DATE_TRUNC('YEAR', monthly.orders_order_month)
          ORDER BY monthly.orders_order_month
          ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW
        )                                                       AS orders_gross_revenue_ytd
      FROM monthly
      LEFT JOIN country_targets
        ON country_targets.country = monthly.orders_country
    )
    SELECT
      monthly_with_targets.orders_country                       AS orders_country,
      monthly_with_targets.orders_order_month                   AS orders_order_month,
      monthly_with_targets.orders_gross_revenue                 AS orders_gross_revenue,
      monthly_with_targets.country_targets_monthly_gross_target AS country_targets_monthly_gross_target,
      monthly_with_targets.orders_gross_revenue
        / NULLIF(monthly_with_targets.country_targets_monthly_gross_target, 0) AS orders_target_attainment,
      monthly_with_targets.orders_gross_revenue_ytd             AS orders_gross_revenue_ytd,
      monthly_with_targets.orders_gross_revenue_prior_year_row  AS orders_gross_revenue_prior_year,
      monthly_with_targets.orders_digital_gross
        / NULLIF(monthly_with_targets.orders_gross_revenue, 0)  AS orders_digital_share,
      monthly_with_targets.orders_count                         AS orders_count,
      monthly_with_targets.orders_total_discount                AS orders_total_discount,
      monthly_with_targets.orders_refunded_count                AS orders_refunded_count,
      monthly_with_targets.orders_active_channels               AS orders_active_channels,
      CASE
        WHEN monthly_with_targets.country_targets_monthly_gross_target IS NULL THEN 'no target'
        WHEN monthly_with_targets.orders_gross_revenue >= monthly_with_targets.country_targets_monthly_gross_target THEN 'on track'
        WHEN monthly_with_targets.orders_gross_revenue >= 0.9 * monthly_with_targets.country_targets_monthly_gross_target THEN 'at risk'
        ELSE 'behind'
      END                                                       AS orders_target_status
    FROM monthly_with_targets
    ORDER BY 1, 2
  label: grain_drift
  rationale: Looker aggregate awareness answered the monthly tile from aggregate table rollup__country__channel__period, which is pre-aggregated by DATE_TRUNC('WEEK', order_date). The monthly CTE then re-buckets with DATE_TRUNC('MONTH', orders_created_period), the month of each week's Monday. Every order in a week that starts in the previous month is attributed to that previous month. For example, Thursday 2026-01-01 lands in December 2025, and a 2025 week starting Dec 29 pulls Jan 1-4 into December. So the values in the orders_order_month column are grouped by an undeclared week-derived period, not by the declared DATE_TRUNC('MONTH', order_date). The status filter, SUM(amount) and the country filter are otherwise correct.
  counterpart_sql: |
    SELECT
      country AS orders_country,
      DATE_TRUNC('MONTH', order_date) AS orders_order_month,
      SUM(amount) AS orders_gross_revenue
    FROM main.finance.orders
    WHERE status = 'completed'
      AND country IN ('US', 'CA', 'GB', 'DE', 'FR', 'MX')
    GROUP BY 1, 2
  key_columns:
  - orders_country
  - orders_order_month
  metric_column: orders_gross_revenue
- id: longbi-11
  metric: gross_revenue
  sql: |
    /* Tableau Server 2026.2 | workbook: "Sales Ops Weekly Pack" | sheet: "FY25 Gross by Country & Channel" | datasource: "Orders (custom SQL)" */
    SELECT
      t3.country                                        AS country,
      t3.channel                                        AS channel,
      t3.sum_amount_ok                                  AS sum_gross_revenue_ok,
      t3.sum_refund_amount_ok                           AS sum_refunds_ok,
      t3.sum_calculation_is_completed_ok                AS sum_completed_orders_ok,
      t3.ctd_order_id_ok                                AS ctd_orders_ok,
      t3.sum_calculation_new_customer_order_ok          AS sum_new_customer_orders_ok,
      t3.sum_calculation_discounted_ok                  AS sum_discounted_orders_ok,
      t3.avg_discount_ok                                AS avg_discount_ok,
      t3.sum_amount_ok / NULLIF(t3.ctd_order_id_ok, 0)  AS calc_avg_order_value,
      t3.sum_amount_ok / NULLIF(SUM(t3.sum_amount_ok) OVER (PARTITION BY t3.country), 0) AS pcto_country_gross,
      RANK() OVER (PARTITION BY t3.country ORDER BY t3.sum_amount_ok DESC NULLS LAST)    AS idx_channel_rank
    FROM (
      SELECT
        t2.country                                      AS country,
        t2.channel                                      AS channel,
        SUM(t2.amount)                                  AS sum_amount_ok,
        SUM(t2.refund_amount)                           AS sum_refund_amount_ok,
        SUM(t2.calculation_is_completed)                AS sum_calculation_is_completed_ok,
        COUNT(DISTINCT t2.order_id)                     AS ctd_order_id_ok,
        SUM(t2.calculation_new_customer_order)          AS sum_calculation_new_customer_order_ok,
        SUM(t2.calculation_discounted)                  AS sum_calculation_discounted_ok,
        AVG(t2.discount)                                AS avg_discount_ok
      FROM (
        SELECT
          Custom_SQL_Query.order_id                     AS order_id,
          Custom_SQL_Query.customer_id                  AS customer_id,
          Custom_SQL_Query.country                      AS country,
          Custom_SQL_Query.channel                      AS channel,
          Custom_SQL_Query.order_date                   AS order_date,
          Custom_SQL_Query.amount                       AS amount,
          Custom_SQL_Query.refund_amount                AS refund_amount,
          Custom_SQL_Query.discount                     AS discount,
          -- [Is Completed]  = IIF([status] = 'completed', 1, 0)
          (CASE WHEN Custom_SQL_Query.status = 'completed' THEN 1 ELSE 0 END) AS calculation_is_completed,
          -- [Discounted]    = IIF([discount] > 0, 1, 0)
          (CASE WHEN Custom_SQL_Query.discount > 0 THEN 1 ELSE 0 END)         AS calculation_discounted,
          -- [New Customer Order] = IIF([order_date] = { FIXED [customer_id] : MIN([order_date]) }, 1, 0)
          (CASE WHEN Custom_SQL_Query.order_date = t1.lod_first_order_date THEN 1 ELSE 0 END) AS calculation_new_customer_order
        FROM (
          -- custom SQL (embedded datasource "Orders")
          SELECT
            o.order_id,
            o.customer_id,
            o.country,
            o.channel,
            o.order_date,
            o.status,
            o.amount,
            o.refund_amount,
            o.discount
          FROM main.finance.orders o
          WHERE o.status NOT IN ('cancelled', 'test')   -- void + QA orders never reach finance
        ) Custom_SQL_Query
        LEFT JOIN (
          -- { FIXED [customer_id] : MIN([order_date]) }
          SELECT
            Custom_SQL_Query.customer_id                AS customer_id,
            MIN(Custom_SQL_Query.order_date)            AS lod_first_order_date
          FROM (
            SELECT
              o.order_id,
              o.customer_id,
              o.order_date,
              o.status
            FROM main.finance.orders o
            WHERE o.status NOT IN ('cancelled', 'test')
          ) Custom_SQL_Query
          GROUP BY 1
        ) t1
          ON (Custom_SQL_Query.customer_id = t1.customer_id)
        WHERE ((Custom_SQL_Query.order_date >= DATE '2025-01-01') AND (Custom_SQL_Query.order_date <= DATE '2025-12-31'))
          AND (Custom_SQL_Query.channel IN ('app', 'partner', 'retail', 'web'))
      ) t2
      GROUP BY 1, 2
    ) t3
    ORDER BY 1 ASC NULLS FIRST, 12 ASC
  label: population_drift
  rationale: The Tableau custom SQL (and the copy inside the FIXED LOD) filters `WHERE o.status NOT IN ('cancelled', 'test')` instead of status = 'completed'. pending, refunded and every other non-cancelled status (including variants such as 'Completed') flow into SUM(amount) for sum_gross_revenue_ok. The string 'completed' appears only in the [Is Completed] calculated field, which feeds the completed-order count column and never filters the revenue. The declared filters (order_date in 2025, channel IN list) and the country/channel grouping are correct. The FIXED LOD join is on a subquery that is unique per customer_id, so it does not change rows.
  counterpart_sql: |
    SELECT
      country,
      channel,
      SUM(amount) AS sum_gross_revenue_ok
    FROM main.finance.orders
    WHERE status = 'completed'
      AND order_date >= DATE '2025-01-01' AND order_date <= DATE '2025-12-31'
      AND channel IN ('app', 'partner', 'retail', 'web')
    GROUP BY 1, 2
  key_columns:
  - country
  - channel
  metric_column: sum_gross_revenue_ok
- id: longbi-12
  metric: gross_revenue
  sql: |
    -- Looker Query Context '{"user_id":51,"history_slug":"a7c3e90d12","instance_slug":"f3a9c1d07e5b"}'
    -- explore: finance_core::daily_trading   dashboard: 1214 "North America Daily Trading"   tile: "Daily gross revenue with 7-day average"
    -- filters: orders.order_date = "92 days from 2026-08-01", orders.country = "US,CA"
    WITH orders_items_daily AS (
      -- view: orders_items_daily (derived_table, ephemeral)
      SELECT
        CAST(o.order_date AS DATE)                              AS order_date,
        SUM(oi.qty)                                             AS units,
        COUNT(DISTINCT oi.sku)                                  AS skus,
        COUNT(DISTINCT o.order_id)                              AS orders_with_items
      FROM main.finance.orders AS o
      INNER JOIN main.finance.order_items AS oi
        ON oi.order_id = o.order_id
      WHERE (o.status = 'completed')
        AND (o.country IN ('US', 'CA'))
        AND ((o.order_date >= DATE '2026-08-01') AND (o.order_date < DATE '2026-08-01' + INTERVAL 92 DAY))
      GROUP BY 1
    ),
    customer_first_order AS (
      -- view: customer_first_order (derived_table, ephemeral)
      SELECT
        cfo.customer_id                                         AS customer_id,
        MIN(cfo.order_date)                                     AS first_order_date
      FROM main.finance.orders AS cfo
      WHERE cfo.status = 'completed'
      GROUP BY 1
    ),
    orders_new_customers_daily AS (
      SELECT
        CAST(o.order_date AS DATE)                              AS order_date,
        COUNT(DISTINCT o.customer_id)                           AS customers,
        COUNT(DISTINCT CASE WHEN cfo.first_order_date = o.order_date THEN o.customer_id END) AS new_customers
      FROM main.finance.orders AS o
      LEFT JOIN customer_first_order AS cfo
        ON cfo.customer_id = o.customer_id
      WHERE (o.status = 'completed')
        AND (o.country IN ('US', 'CA'))
        AND ((o.order_date >= DATE '2026-08-01') AND (o.order_date < DATE '2026-08-01' + INTERVAL 92 DAY))
      GROUP BY 1
    ),
    orders_daily AS (
      -- view: orders  (sql_always_where: ${orders.status} = 'completed')
      SELECT
        CAST(orders.order_date AS DATE)                         AS orders_order_date,
        CAST(SUM(orders.amount) AS DOUBLE)                      AS orders_gross_revenue,
        COUNT(*)                                                AS orders_count,
        SUM(CASE WHEN orders.country = 'US' THEN orders.amount END) AS orders_gross_revenue_us,
        SUM(CASE WHEN orders.country = 'CA' THEN orders.amount END) AS orders_gross_revenue_ca,
        SUM(orders.discount)                                    AS orders_total_discount,
        MAX(orders.amount)                                      AS orders_largest_order
      FROM main.finance.orders AS orders
      WHERE (orders.status = 'completed')
        AND (orders.country IN ('US', 'CA'))
        AND ((orders.order_date >= DATE '2026-08-01') AND (orders.order_date < DATE '2026-08-01' + INTERVAL 92 DAY))
      GROUP BY 1
    ),
    orders_daily_windows AS (
      SELECT
        orders_daily.*,
        AVG(orders_daily.orders_gross_revenue) OVER (
          ORDER BY orders_daily.orders_order_date
          ROWS BETWEEN 6 PRECEDING AND CURRENT ROW
        )                                                       AS orders_gross_revenue_7d_avg,
        SUM(orders_daily.orders_gross_revenue) OVER (
          PARTITION BY DATE_TRUNC('MONTH', orders_daily.orders_order_date)
          ORDER BY orders_daily.orders_order_date
          ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW
        )                                                       AS orders_gross_revenue_mtd,
        PERCENT_RANK() OVER (ORDER BY orders_daily.orders_gross_revenue) AS orders_gross_revenue_pct_rank
      FROM orders_daily
    )
    SELECT
      orders_daily_windows.orders_order_date                    AS orders_order_date,
      DATE_TRUNC('WEEK', orders_daily_windows.orders_order_date) AS orders_order_week,
      orders_daily_windows.orders_gross_revenue                 AS orders_gross_revenue,
      orders_daily_windows.orders_gross_revenue_7d_avg          AS orders_gross_revenue_7d_avg,
      orders_daily_windows.orders_gross_revenue_mtd             AS orders_gross_revenue_mtd,
      orders_daily_windows.orders_gross_revenue_us              AS orders_gross_revenue_us,
      orders_daily_windows.orders_gross_revenue_ca              AS orders_gross_revenue_ca,
      orders_daily_windows.orders_count                         AS orders_count,
      orders_daily_windows.orders_total_discount                AS orders_total_discount,
      orders_daily_windows.orders_largest_order                 AS orders_largest_order,
      orders_daily_windows.orders_gross_revenue_pct_rank        AS orders_gross_revenue_pct_rank,
      orders_items_daily.units                                  AS orders_items_daily_units,
      orders_items_daily.skus                                   AS orders_items_daily_skus,
      orders_new_customers_daily.customers                      AS orders_customers,
      orders_new_customers_daily.new_customers                  AS orders_new_customers,
      CASE
        WHEN orders_daily_windows.orders_gross_revenue_7d_avg IS NULL THEN NULL
        WHEN orders_daily_windows.orders_gross_revenue > 1.5 * orders_daily_windows.orders_gross_revenue_7d_avg THEN 'spike'
        WHEN orders_daily_windows.orders_gross_revenue < 0.5 * orders_daily_windows.orders_gross_revenue_7d_avg THEN 'dip'
        ELSE 'normal'
      END                                                       AS orders_daily_signal
    FROM orders_daily_windows
    LEFT JOIN orders_items_daily
      ON orders_items_daily.order_date = orders_daily_windows.orders_order_date
    LEFT JOIN orders_new_customers_daily
      ON orders_new_customers_daily.order_date = orders_daily_windows.orders_order_date
    ORDER BY 1
  label: permitted_variation
  rationale: 'orders_gross_revenue comes from orders_daily: main.finance.orders with status = ''completed'', country IN (''US'',''CA'') and order_date >= DATE ''2026-08-01'' AND < DATE ''2026-08-01'' + INTERVAL 92 DAY (= 2026-11-01), all filters on declared dimensions. It is grouped by CAST(order_date AS DATE), which is a no-op on a DATE column, so the group is the declared order_date. CAST(SUM(amount) AS DOUBLE) cannot change a DOUBLE. The order_items INNER JOIN and the customer_first_order join are confined to their own CTEs, each aggregated per date and LEFT JOINed back. The window columns (7-day average, MTD, percent rank) are derived and do not alter the daily value.'
  counterpart_sql: |
    SELECT
      order_date AS orders_order_date,
      SUM(amount) AS orders_gross_revenue
    FROM main.finance.orders
    WHERE status = 'completed'
      AND country IN ('US', 'CA')
      AND order_date >= DATE '2026-08-01' AND order_date < DATE '2026-11-01'
    GROUP BY 1
  key_columns:
  - orders_order_date
  metric_column: orders_gross_revenue
