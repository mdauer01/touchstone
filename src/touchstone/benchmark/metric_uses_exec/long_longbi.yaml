- id: longbi-06
  metric: gross_revenue
  sql: |
    -- Hex | project: "Channel Economics FY26" | cell: "gross_by_country_channel" (SQL, data connection: databricks-finance-prod)
    -- compiled with upstream dataframe references inlined: raw_orders -> orders_deduped -> orders_in_window -> channel_gross
    WITH raw_orders AS (
      -- cell: raw_orders
      SELECT
        order_id,
        customer_id,
        amount,
        refund_amount,
        discount,
        status,
        country,
        channel,
        order_date
      FROM main.finance.orders
    ),
    orders_deduped AS (
      -- cell: orders_deduped
      -- the orders feed occasionally re-delivers a row when an order is touched; keep the most recent version per order
      SELECT
        raw_orders.*
      FROM raw_orders
      QUALIFY ROW_NUMBER() OVER (
        PARTITION BY raw_orders.order_id
        ORDER BY raw_orders.order_date DESC, raw_orders.amount DESC
      ) = 1
    ),
    orders_in_window AS (
      -- cell: orders_in_window   (input params: start_date = 2025-10-01, end_date = 2026-10-01)
      SELECT
        orders_deduped.order_id,
        orders_deduped.customer_id,
        orders_deduped.country,
        orders_deduped.channel,
        orders_deduped.order_date,
        orders_deduped.amount,
        orders_deduped.refund_amount,
        orders_deduped.discount,
        CASE
          WHEN orders_deduped.channel IN ('web', 'app') THEN 'digital'
          WHEN orders_deduped.channel IN ('retail')     THEN 'store'
          ELSE 'other'
        END AS channel_family
      FROM orders_deduped
      WHERE orders_deduped.status = 'completed'
        AND orders_deduped.order_date >= DATE '2025-10-01'
        AND orders_deduped.order_date <  DATE '2026-10-01'
    ),
    customer_order_counts AS (
      -- cell: customer_order_counts
      SELECT
        orders_in_window.customer_id,
        COUNT(*) AS orders_in_window
      FROM orders_in_window
      GROUP BY 1
    ),
    customer_attrs AS (
      -- cell: customer_attrs
      SELECT
        oiw.country,
        oiw.channel,
        COUNT(DISTINCT oiw.customer_id)                                                   AS customers,
        COUNT(DISTINCT CASE WHEN coc.orders_in_window > 1 THEN oiw.customer_id END)       AS repeat_customers,
        COUNT(DISTINCT CASE WHEN c.segment IN ('enterprise', 'mid_market') THEN oiw.customer_id END) AS b2b_customers
      FROM orders_in_window AS oiw
      LEFT JOIN customer_order_counts AS coc
        ON coc.customer_id = oiw.customer_id
      LEFT JOIN main.finance.customers AS c
        ON c.customer_id = oiw.customer_id
      GROUP BY 1, 2
    ),
    channel_gross AS (
      -- cell: channel_gross
      SELECT
        orders_in_window.country,
        orders_in_window.channel,
        ANY_VALUE(orders_in_window.channel_family)       AS channel_family,
        SUM(orders_in_window.amount)                     AS gross_revenue,
        COUNT(*)                                         AS orders,
        SUM(orders_in_window.discount)                   AS discount_total,
        MIN(orders_in_window.order_date)                 AS first_order_date,
        MAX(orders_in_window.order_date)                 AS last_order_date
      FROM orders_in_window
      GROUP BY 1, 2
    )
    -- cell: gross_by_country_channel (output -> chart "Gross by channel, stacked by country")
    SELECT
      channel_gross.country,
      channel_gross.channel,
      channel_gross.channel_family,
      channel_gross.gross_revenue,
      channel_gross.orders,
      channel_gross.gross_revenue / NULLIF(channel_gross.orders, 0)          AS avg_order_value,
      channel_gross.discount_total,
      customer_attrs.customers,
      customer_attrs.repeat_customers,
      customer_attrs.b2b_customers,
      channel_gross.gross_revenue
        / NULLIF(SUM(channel_gross.gross_revenue) OVER (PARTITION BY channel_gross.country), 0) AS share_of_country_gross,
      DENSE_RANK() OVER (
        PARTITION BY channel_gross.country
        ORDER BY channel_gross.gross_revenue DESC NULLS LAST
      )                                                                      AS channel_rank_in_country,
      channel_gross.first_order_date,
      channel_gross.last_order_date
    FROM channel_gross
    LEFT JOIN customer_attrs
      ON customer_attrs.country IS NOT DISTINCT FROM channel_gross.country
     AND customer_attrs.channel IS NOT DISTINCT FROM channel_gross.channel
    ORDER BY channel_gross.country NULLS LAST, channel_rank_in_country, channel_gross.channel NULLS LAST
  label: insufficient_evidence
  rationale: The Hex cell orders_deduped keeps one row per order_id (QUALIFY ROW_NUMBER() OVER (PARTITION BY order_id ORDER BY order_date DESC, amount DESC) = 1), and it does so BEFORE the status = 'completed' filter is applied in orders_in_window. If order_id is unique, this is a no-op and gross_revenue equals the governed SUM(amount) per (country, channel) over the declared order_date window. The definitions do not state that order_id is unique. With duplicate order_ids, the dedupe drops completed rows, and it can keep a later non-completed version in place of a completed one. Whether this is a permitted variation or a population change therefore depends on unstated key uniqueness.
  counterpart_sql: |
    SELECT
      country,
      channel,
      SUM(amount) AS gross_revenue
    FROM main.finance.orders
    WHERE status = 'completed'
      AND order_date >= DATE '2025-10-01' AND order_date < DATE '2026-10-01'
    GROUP BY 1, 2
  key_columns:
  - country
  - channel
  metric_column: gross_revenue
- id: longbi-07
  metric: gross_revenue
  sql: |
    -- Sigma Computing | workbook: "Revenue Pulse" | page: "Channels" | element: "Monthly gross by channel" (pivot -> table)
    -- sigma-query-id: 01J9X7Q2M5D8V3K6T0R4B1N7ZC   warehouse: databricks / sql-warehouse finance-bi-xs
    with Q1 as (
      select
        ORDERS.ORDER_ID       ORDER_ID_1,
        ORDERS.CUSTOMER_ID    CUSTOMER_ID_2,
        ORDERS.AMOUNT         AMOUNT_3,
        ORDERS.REFUND_AMOUNT  REFUND_AMOUNT_4,
        ORDERS.DISCOUNT       DISCOUNT_5,
        ORDERS.STATUS         STATUS_6,
        ORDERS.COUNTRY        COUNTRY_7,
        ORDERS.CHANNEL        CHANNEL_8,
        ORDERS.ORDER_DATE     ORDER_DATE_9
      from main.finance.orders ORDERS
    ),
    Q2 as (
      -- linked table: order_items, summarized to one row per order before lookup
      select
        ORDER_ITEMS.ORDER_ID                 ORDER_ID_10,
        sum(ORDER_ITEMS.QTY)                 SUM_QTY_11,
        count(distinct ORDER_ITEMS.SKU)      COUNT_DISTINCT_SKU_12
      from main.finance.order_items ORDER_ITEMS
      group by ORDER_ITEMS.ORDER_ID
    ),
    Q3 as (
      select
        Q1.ORDER_ID_1,
        Q1.CUSTOMER_ID_2,
        Q1.AMOUNT_3,
        Q1.REFUND_AMOUNT_4,
        Q1.DISCOUNT_5,
        Q1.STATUS_6,
        Q1.COUNTRY_7,
        Q1.CHANNEL_8,
        Q1.ORDER_DATE_9,
        date_trunc('MONTH', Q1.ORDER_DATE_9) MONTH_OF_ORDER_DATE_13,
        Q2.SUM_QTY_11                        UNITS_14,
        Q2.COUNT_DISTINCT_SKU_12             SKUS_15,
        case when Q2.ORDER_ID_10 is null then 1 else 0 end NO_ITEMS_FLAG_16
      from Q1
      left join Q2
        on Q1.ORDER_ID_1 = Q2.ORDER_ID_10
    ),
    Q4 as (
      select *
      from Q3
      where Q3.STATUS_6 = 'completed'
        and Q3.CHANNEL_8 in ('web', 'app', 'retail', 'partner')
        and Q3.MONTH_OF_ORDER_DATE_13 >= DATE '2025-07-01'
        and Q3.MONTH_OF_ORDER_DATE_13 <  DATE '2026-07-01'
    ),
    Q5 as (
      select
        Q4.MONTH_OF_ORDER_DATE_13,
        Q4.CHANNEL_8,
        sum(Q4.AMOUNT_3)                     GROSS_REVENUE_17,
        count(Q4.ORDER_ID_1)                 ORDERS_18,
        count(distinct Q4.CUSTOMER_ID_2)     CUSTOMERS_19,
        sum(Q4.UNITS_14)                     UNITS_20,
        sum(Q4.NO_ITEMS_FLAG_16)             ORDERS_WITHOUT_ITEMS_21,
        sum(Q4.DISCOUNT_5)                   DISCOUNT_22
      from Q4
      group by
        Q4.MONTH_OF_ORDER_DATE_13,
        Q4.CHANNEL_8
    ),
    Q6 as (
      select
        Q5.*,
        lag(Q5.GROSS_REVENUE_17) over (
          partition by Q5.CHANNEL_8
          order by Q5.MONTH_OF_ORDER_DATE_13
        )                                    PRIOR_MONTH_GROSS_23,
        rank() over (
          partition by Q5.MONTH_OF_ORDER_DATE_13
          order by Q5.GROSS_REVENUE_17 desc nulls last
        )                                    CHANNEL_RANK_24,
        sum(Q5.GROSS_REVENUE_17) over (
          partition by Q5.MONTH_OF_ORDER_DATE_13
        )                                    MONTH_TOTAL_GROSS_25
      from Q5
    ),
    Q7 as (
      select
        Q6.MONTH_OF_ORDER_DATE_13,
        Q6.CHANNEL_8,
        Q6.GROSS_REVENUE_17,
        Q6.ORDERS_18,
        Q6.CUSTOMERS_19,
        Q6.UNITS_20,
        Q6.ORDERS_WITHOUT_ITEMS_21,
        Q6.DISCOUNT_22,
        Q6.CHANNEL_RANK_24,
        case
          when Q6.PRIOR_MONTH_GROSS_23 is null or Q6.PRIOR_MONTH_GROSS_23 = 0 then null
          else (Q6.GROSS_REVENUE_17 - Q6.PRIOR_MONTH_GROSS_23) / Q6.PRIOR_MONTH_GROSS_23
        end                                  MOM_GROWTH_26,
        Q6.GROSS_REVENUE_17 / nullif(Q6.MONTH_TOTAL_GROSS_25, 0) CHANNEL_SHARE_27,
        Q6.GROSS_REVENUE_17 / nullif(Q6.ORDERS_18, 0)            AOV_28,
        cast(Q6.UNITS_20 as double) / nullif(Q6.ORDERS_18, 0)    UNITS_PER_ORDER_29
      from Q6
    )
    select
      Q7.MONTH_OF_ORDER_DATE_13  month_of_order_date,
      Q7.CHANNEL_8               channel,
      Q7.GROSS_REVENUE_17        gross_revenue,
      Q7.ORDERS_18               orders,
      Q7.CUSTOMERS_19            customers,
      Q7.UNITS_20                units,
      Q7.ORDERS_WITHOUT_ITEMS_21 orders_without_items,
      Q7.DISCOUNT_22             discount,
      Q7.CHANNEL_RANK_24         channel_rank,
      Q7.MOM_GROWTH_26           mom_growth,
      Q7.CHANNEL_SHARE_27        channel_share,
      Q7.AOV_28                  aov,
      Q7.UNITS_PER_ORDER_29      units_per_order
    from Q7
    order by Q7.MONTH_OF_ORDER_DATE_13 asc, Q7.CHANNEL_RANK_24 asc, Q7.CHANNEL_8 asc
  label: permitted_variation
  rationale: In the Sigma query, Q2 summarizes order_items to one row per ORDER_ID before the LEFT JOIN in Q3, so the lookup cannot duplicate or drop order rows, and its columns feed only units, skus and the no-items flag. Q4 applies status = 'completed', channel IN ('web','app','retail','partner') and a window on the declared month DATE_TRUNC('MONTH', order_date). Q5 groups by month and channel with sum(AMOUNT). The Q6/Q7 window functions (lag, rank, month total) only add derived columns. They neither change a group's gross value nor limit the groups returned.
