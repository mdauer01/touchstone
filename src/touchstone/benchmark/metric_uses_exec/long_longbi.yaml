- id: longbi-08
  metric: net_revenue
  sql: |
    -- Sigma Computing | workbook: "US Revenue Bridge" | page: "Monthly" | element: "Net revenue by channel" (grouped table: CHANNEL > MONTH)
    -- sigma-query-id: 01J9Y2C8K4P7R1W5F3H6N9Q0TD   warehouse: databricks / sql-warehouse finance-bi-xs
    with Q1 as (
      select
        ORDERS.ORDER_ID       ORDER_ID_1,
        ORDERS.CUSTOMER_ID    CUSTOMER_ID_2,
        ORDERS.AMOUNT         AMOUNT_3,
        ORDERS.REFUND_AMOUNT  REFUND_AMOUNT_4,
        ORDERS.DISCOUNT       DISCOUNT_5,
        ORDERS.STATUS         STATUS_6,
        ORDERS.COUNTRY        COUNTRY_7,
        ORDERS.CHANNEL        CHANNEL_8,
        ORDERS.ORDER_DATE     ORDER_DATE_9
      from main.finance.orders ORDERS
    ),
    Q2 as (
      select
        CUSTOMERS.CUSTOMER_ID CUSTOMER_ID_10,
        CUSTOMERS.SEGMENT     SEGMENT_11,
        CUSTOMERS.REGION      REGION_12
      from main.finance.customers CUSTOMERS
    ),
    Q3 as (
      -- calculated columns defined on the workbook data source "US Orders"
      select
        Q1.ORDER_ID_1,
        Q1.CUSTOMER_ID_2,
        Q1.CHANNEL_8,
        Q1.ORDER_DATE_9,
        date_trunc('MONTH', Q1.ORDER_DATE_9)                       MONTH_13,
        Q1.AMOUNT_3,
        Q1.REFUND_AMOUNT_4,
        coalesce(Q1.DISCOUNT_5, 0)                                 DISCOUNT_14,
        coalesce(Q1.AMOUNT_3 - Q1.REFUND_AMOUNT_4, 0)              NET_AMOUNT_15,
        Q1.AMOUNT_3 + coalesce(Q1.DISCOUNT_5, 0)                   LIST_AMOUNT_16,
        case when Q1.REFUND_AMOUNT_4 > 0 then 1 else 0 end         IS_REFUNDED_17,
        case
          when Q1.AMOUNT_3 >= 250 then 'L'
          when Q1.AMOUNT_3 >= 75  then 'M'
          else 'S'
        end                                                        SIZE_BAND_18
      from Q1
      where Q1.STATUS_6 = 'completed'
        and Q1.COUNTRY_7 = 'US'
        and Q1.ORDER_DATE_9 >= DATE '2026-01-01'
        and Q1.ORDER_DATE_9 <= DATE '2026-12-31'
    ),
    Q4 as (
      select
        Q3.CHANNEL_8,
        Q3.MONTH_13,
        sum(Q3.NET_AMOUNT_15)                                      NET_REVENUE_19,
        sum(Q3.AMOUNT_3)                                           AMOUNT_20,
        sum(Q3.REFUND_AMOUNT_4)                                    REFUNDS_21,
        sum(Q3.DISCOUNT_14)                                        DISCOUNT_22,
        sum(Q3.LIST_AMOUNT_16)                                     LIST_AMOUNT_23,
        count(Q3.ORDER_ID_1)                                       ORDERS_24,
        sum(Q3.IS_REFUNDED_17)                                     REFUNDED_ORDERS_25,
        count_if(Q3.SIZE_BAND_18 = 'L')                            LARGE_ORDERS_26
      from Q3
      group by Q3.CHANNEL_8, Q3.MONTH_13
    ),
    Q5 as (
      -- lookup: customers per channel/month with B2B split (separate grain, joined back on group keys)
      select
        Q3.CHANNEL_8,
        Q3.MONTH_13,
        count(distinct Q3.CUSTOMER_ID_2)                                                   CUSTOMERS_27,
        count(distinct case when Q2.SEGMENT_11 in ('enterprise', 'mid_market') then Q3.CUSTOMER_ID_2 end) B2B_CUSTOMERS_28
      from Q3
      left join Q2
        on Q3.CUSTOMER_ID_2 = Q2.CUSTOMER_ID_10
      group by Q3.CHANNEL_8, Q3.MONTH_13
    ),
    Q6 as (
      select
        Q4.*,
        Q5.CUSTOMERS_27,
        Q5.B2B_CUSTOMERS_28,
        sum(Q4.NET_REVENUE_19) over (partition by Q4.CHANNEL_8)    CHANNEL_NET_TOTAL_29,
        sum(Q4.NET_REVENUE_19) over (
          partition by Q4.CHANNEL_8
          order by Q4.MONTH_13
          rows between unbounded preceding and current row
        )                                                          CHANNEL_NET_YTD_30
      from Q4
      left join Q5
        on Q4.CHANNEL_8 is not distinct from Q5.CHANNEL_8
       and Q4.MONTH_13 = Q5.MONTH_13
    )
    select
      Q6.CHANNEL_8                                                 as channel,
      Q6.MONTH_13                                                  as month,
      Q6.NET_REVENUE_19                                            as net_revenue,
      Q6.AMOUNT_20                                                 amount,
      Q6.REFUNDS_21                                                refunds,
      Q6.REFUNDS_21 / nullif(Q6.AMOUNT_20, 0)                      refund_rate,
      Q6.DISCOUNT_22 / nullif(Q6.LIST_AMOUNT_23, 0)                discount_rate,
      Q6.ORDERS_24                                                 orders,
      Q6.REFUNDED_ORDERS_25                                        refunded_orders,
      Q6.LARGE_ORDERS_26                                           large_orders,
      Q6.CUSTOMERS_27                                              customers,
      Q6.B2B_CUSTOMERS_28                                          b2b_customers,
      Q6.CHANNEL_NET_YTD_30                                        net_revenue_ytd,
      Q6.NET_REVENUE_19 / nullif(Q6.CHANNEL_NET_TOTAL_29, 0)       share_of_channel_year
    from Q6
    order by Q6.CHANNEL_8 asc nulls last, Q6.MONTH_13 asc
  label: formula_drift
  rationale: In the Sigma data source, Q3 defines the calculated column NET_AMOUNT_15 = coalesce(AMOUNT - REFUND_AMOUNT, 0), and Q4 returns sum(NET_AMOUNT_15) as net_revenue. refund_amount is nullable, so for every completed order with no refund the row-level difference is NULL and is coalesced to 0. Its amount drops out of net revenue entirely. A group with no recorded refunds shows 0 where the declared SUM(amount) - SUM(refund_amount) gives NULL. The filters (status = 'completed', country = 'US', order_date in 2026) and the channel/month grouping are correct. Only the arithmetic differs.
