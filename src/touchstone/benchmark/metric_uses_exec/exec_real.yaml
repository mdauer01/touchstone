    GROUP BY country
- id: real-28
  metric: gross_revenue
  sql: |
    -- Germany by channel; country comes in as 'Germany', 'germany ', 'GERMANY'
    SELECT channel,
           SUM(amount) AS gross_revenue
    FROM main.finance.orders
    WHERE status = 'completed'
      AND UPPER(TRIM(country)) LIKE 'GERMAN%'
    GROUP BY channel
  label: permitted_variation
  rationale: The typo-tolerant LIKE is still a predicate only over country, a declared dimension, so it is a permitted slice; the required filter is kept exact (status = 'completed'), the formula is SUM(amount) and the grouping is the declared channel dimension.
  counterpart_sql: |
    SELECT channel,
           SUM(amount) AS gross_revenue
    FROM main.finance.orders
    WHERE status = 'completed'
      AND UPPER(TRIM(country)) LIKE 'GERMAN%'
    GROUP BY channel
- id: real-29
  metric: gross_revenue
  sql: |
    -- YTD gross revenue line chart
    SELECT month,
           SUM(monthly_gross) OVER (PARTITION BY YEAR(month) ORDER BY month
                                    ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS gross_revenue
    FROM (
      SELECT DATE_TRUNC('MONTH', order_date) AS month, SUM(amount) AS monthly_gross
      FROM main.finance.orders
      WHERE status = 'completed'
      GROUP BY 1
    ) m
    ORDER BY month
  label: formula_drift
  rationale: Each month's value is the year-to-date running total of monthly sums, a cumulative version of gross_revenue rather than the month's own SUM(amount).
  counterpart_sql: |
    SELECT DATE_TRUNC('MONTH', order_date) AS month,
           SUM(amount) AS gross_revenue
    FROM main.finance.orders
    WHERE status = 'completed'
    GROUP BY 1
    ORDER BY month
- id: real-30
  metric: gross_revenue
  sql: |
    with order_lines as (
        select o.order_id, o.status, o.channel, o.order_date, o.amount, i.sku, i.qty
        from main.finance.orders o
        join main.finance.order_items i on i.order_id = o.order_id
    )
    select channel,
           sum(amount) as gross_revenue
    from order_lines
    where status = 'completed'
    group by channel
  label: source_drift
  rationale: Summing an order-level amount over an orders x order_items line model counts each order once per item line (fan-out) and drops orders with no item rows, so the rows counted are no longer the orders rows.
  counterpart_sql: |
    SELECT channel,
           SUM(amount) AS gross_revenue
    FROM main.finance.orders
    WHERE status = 'completed'
    GROUP BY channel
