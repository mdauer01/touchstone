family: exec_real
split: test
items:
- id: real-01
  metric: gross_revenue
  sql: |
    SELECT DATE_TRUNC('MONTH', Custom_SQL_Query.order_date) AS tmn_order_date_ok,
      SUM(Custom_SQL_Query.gross_revenue) AS sum_gross_revenue_ok
    FROM (
      SELECT order_id, order_date, country, channel, amount AS gross_revenue
      FROM main.finance.orders
      WHERE status = 'completed'
    ) Custom_SQL_Query
    WHERE (Custom_SQL_Query.order_date >= DATE '2026-01-01')
      AND (Custom_SQL_Query.order_date < DATE '2027-01-01')
    GROUP BY 1
  label: permitted_variation
  rationale: Tableau wraps a custom SQL that only projects and filters orders (status = 'completed', amount renamed gross_revenue); the generated aggregation is SUM of amount grouped by DATE_TRUNC('MONTH', order_date), which is the declared month dimension exactly, with a 2026 window on order_date.
  counterpart_sql: |
    SELECT DATE_TRUNC('MONTH', order_date) AS tmn_order_date_ok,
      SUM(amount) AS sum_gross_revenue_ok
    FROM main.finance.orders
    WHERE status = 'completed'
      AND order_date >= DATE '2026-01-01' AND order_date < DATE '2027-01-01'
    GROUP BY 1
- id: real-02
  metric: net_revenue
  sql: |
    SELECT SUM(o.amount) - SUM(o.refund_amount) AS net_revenue
    FROM main.finance.orders o
    WHERE o.status IN ('completed')
      AND o.channel IN ('web', 'app')
      AND o.order_date >= DATE '2026-07-01' AND o.order_date < DATE '2026-10-01'
  label: permitted_variation
  rationale: A single-value IN list on status is the same predicate as status = 'completed', so the required filter holds unchanged; the extra filters are on channel and order_date, both declared, and the formula is the declared one.
  counterpart_sql: |
    SELECT SUM(amount) - SUM(refund_amount) AS net_revenue
    FROM main.finance.orders
    WHERE status = 'completed'
      AND channel IN ('web', 'app')
      AND order_date >= DATE '2026-07-01' AND order_date < DATE '2026-10-01'
- id: real-03
  metric: net_revenue
  sql: |
    -- top 5 markets YTD
    SELECT country,
           SUM(amount) - SUM(refund_amount) AS net_revenue
    FROM main.finance.orders
    WHERE status = 'completed'
      AND order_date >= DATE '2026-01-01'
    GROUP BY country
    ORDER BY net_revenue DESC NULLS LAST, country
    LIMIT 5
  label: permitted_variation
  rationale: Declared formula and required filter, grouped by country with a year-to-date window on order_date; ordering by the value with country as tiebreaker is a total order over groups, so LIMIT 5 only limits groups and leaves each group's value unchanged.
  counterpart_sql: |
    SELECT country,
           SUM(amount) - SUM(refund_amount) AS net_revenue
    FROM main.finance.orders
    WHERE status = 'completed'
      AND order_date >= DATE '2026-01-01'
    GROUP BY country
    ORDER BY net_revenue DESC NULLS LAST, country
    LIMIT 5
- id: real-04
  metric: gross_revenue
  sql: |
    -- notebook: Q3 board pack tie-out
    SELECT
      SUM(amount) FILTER (WHERE status = 'completed') AS gross_revenue
    FROM main.finance.orders
    WHERE order_date BETWEEN DATE '2026-07-01' AND DATE '2026-09-30'
  label: permitted_variation
  rationale: The required filter is applied as an aggregate FILTER clause instead of WHERE; with no GROUP BY the query returns one row and SUM over completed rows in the Q3 order_date window is the same value (NULL when none), so the required filter holds and the formula is unchanged.
  counterpart_sql: |
    SELECT SUM(amount) AS gross_revenue
    FROM main.finance.orders
    WHERE status = 'completed'
      AND order_date BETWEEN DATE '2026-07-01' AND DATE '2026-09-30'
- id: real-05
  metric: net_revenue
  sql: |
    -- sql generated by Looker | explore: orders | measure: orders.net_revenue
    SELECT
        orders.country AS orders_country,
        SUM(orders.amount) AS orders_net_revenue
    FROM main.finance.orders AS orders
    WHERE (orders.status = 'completed')
    GROUP BY
        1
    ORDER BY
        2 DESC NULLS LAST, 1
  label: identity_mismatch
  rationale: The measure is presented as net_revenue but computes SUM(amount) over completed orders, which is exactly gross_revenue's definition; refunds are never subtracted.
  counterpart_sql: |
    SELECT country AS orders_country,
           SUM(amount) - SUM(refund_amount) AS orders_net_revenue
    FROM main.finance.orders
    WHERE status = 'completed'
    GROUP BY 1
    ORDER BY 2 DESC NULLS LAST, 1
- id: real-06
  metric: gross_revenue
  sql: |
    SELECT t2.channel AS channel, t2.a0 AS gross_revenue
    FROM (
      SELECT t1.channel AS channel, SUM(t1.amount) AS a0
      FROM (
        SELECT channel, amount, order_date
        FROM main.finance.orders
      ) AS t1
      WHERE t1.order_date >= DATE '2025-01-01' AND t1.order_date < DATE '2027-01-01'
      GROUP BY t1.channel
    ) AS t2
  label: population_drift
  rationale: The Power BI visual only carries the date slicer; status is never projected or filtered, so the required filter status = 'completed' is dropped and cancelled/pending/refunded orders are summed into gross_revenue.
  counterpart_sql: |
    SELECT channel AS channel, SUM(amount) AS gross_revenue
    FROM main.finance.orders
    WHERE status = 'completed'
      AND order_date >= DATE '2025-01-01' AND order_date < DATE '2027-01-01'
    GROUP BY channel
- id: real-07
  metric: gross_revenue
  sql: |
    -- sql generated by Looker | explore: orders | measure type: sum
    SELECT
        orders.country AS orders_country,
        COALESCE(SUM(orders.amount), 0) AS orders_gross_revenue
    FROM main.finance.orders AS orders
    WHERE (orders.status = 'completed') AND ((( orders.order_date ) >= ((DATE '2025-01-01')) AND ( orders.order_date ) < ((DATE '2027-01-01'))))
    GROUP BY
        1
    ORDER BY
        2 DESC, 1
    LIMIT 500
  label: insufficient_evidence
  rationale: Looker's COALESCE(SUM(amount), 0) equals SUM(amount) for every non-empty group unless all of a country's completed amounts are NULL (then 0 vs NULL); the spec does not state whether amount is nullable, so the text alone cannot decide.
  counterpart_sql: |
    SELECT country AS orders_country,
           SUM(amount) AS orders_gross_revenue
    FROM main.finance.orders
    WHERE status = 'completed'
      AND order_date >= DATE '2025-01-01' AND order_date < DATE '2027-01-01'
    GROUP BY 1
    ORDER BY 2 DESC, 1
    LIMIT 500
- id: real-08
  metric: gross_revenue
  sql: |
    with source as (
        select * from main.finance.orders
    ),
    renamed as (
        select
            order_id,
            customer_id,
            status        as order_status,
            country       as country_code,
            channel       as sales_channel,
            order_date    as ordered_on,
            amount        as order_amount
        from source
    ),
    completed as (
        select * from renamed where order_status = 'completed'
    )
    select
        country_code,
        sales_channel,
        sum(order_amount) as gross_revenue
    from completed
    group by 1, 2
  label: permitted_variation
  rationale: dbt-style source/renamed/completed CTEs are pure select-project-filter steps over orders (renames only); the required filter is applied on the renamed status column unchanged, the measure is SUM(amount), and grouping is by country and channel, both declared dimensions.
  counterpart_sql: |
    SELECT country AS country_code,
           channel AS sales_channel,
           SUM(amount) AS gross_revenue
    FROM main.finance.orders
    WHERE status = 'completed'
    GROUP BY 1, 2
- id: real-09
  metric: net_revenue
  sql: |
    -- dedupe step left over from an earlier bad join
    WITH dedup AS (
      SELECT DISTINCT country, channel, order_date, status, amount, refund_amount
      FROM main.finance.orders
    )
    SELECT country,
           SUM(amount) - SUM(refund_amount) AS net_revenue
    FROM dedup
    WHERE status = 'completed'
    GROUP BY country
  label: source_drift
  rationale: 'SELECT DISTINCT over a projection without order_id is not a select-project-filter step: two different orders with the same country, channel, date, status, amount and refund collapse into one row, so fewer rows are counted even when order_id is unique.'
  counterpart_sql: |
    SELECT country,
           SUM(amount) - SUM(refund_amount) AS net_revenue
    FROM main.finance.orders
    WHERE status = 'completed'
    GROUP BY country
- id: real-10
  metric: gross_revenue
  sql: |
    SELECT order_date,
           CAST(SUM(CAST(amount AS DOUBLE)) AS DOUBLE) AS gross_revenue
    FROM main.finance.orders
    WHERE status = 'completed'
      AND order_date >= DATE '2026-10-01' AND order_date <= DATE '2026-10-31'
    GROUP BY order_date
    ORDER BY order_date
  label: permitted_variation
  rationale: Both casts are DOUBLE to DOUBLE on a DOUBLE column/sum, which cannot change any value, so the formula is the declared SUM(amount); the daily grouping is the declared order_date dimension and the October window is on order_date.
  counterpart_sql: |
    SELECT order_date,
           SUM(amount) AS gross_revenue
    FROM main.finance.orders
    WHERE status = 'completed'
      AND order_date >= DATE '2026-10-01' AND order_date <= DATE '2026-10-31'
    GROUP BY order_date
    ORDER BY order_date
- id: real-11
  metric: gross_revenue
  sql: |
    SELECT Orders.country AS country,
      SUM(Orders.amount) AS sum_gross_revenue_ok
    FROM main.finance.orders Orders
      LEFT JOIN main.finance.customers Customers ON (Orders.customer_id = Customers.customer_id)
    WHERE (Orders.status = 'completed')
    GROUP BY 1
  label: insufficient_evidence
  rationale: The Tableau data source's LEFT JOIN to customers keeps every order and uses no customer column, so it changes nothing if customers.customer_id is unique but fans out amounts if it is not; key uniqueness is not stated.
  counterpart_sql: |
    SELECT country AS country,
      SUM(amount) AS sum_gross_revenue_ok
    FROM main.finance.orders
    WHERE status = 'completed'
    GROUP BY 1
- id: real-12
  metric: gross_revenue
  sql: |
    SELECT channel,
           SUM(amount) - SUM(refund_amount) AS gross_revenue
    FROM main.finance.orders
    WHERE status = 'completed'
    GROUP BY channel
  label: identity_mismatch
  rationale: The column is named gross_revenue but computes SUM(amount) - SUM(refund_amount), the net_revenue definition; correct math for net revenue, presented under the gross metric's name.
  counterpart_sql: |
    SELECT channel,
           SUM(amount) AS gross_revenue
    FROM main.finance.orders
    WHERE status = 'completed'
    GROUP BY channel
- id: real-13
  metric: gross_revenue
  sql: |
    -- sql generated by Looker | explore: orders | dimension group: order_date (week)
    SELECT
        DATE_TRUNC('WEEK', orders.order_date) AS orders_order_week,
        SUM(orders.amount) AS orders_gross_revenue
    FROM main.finance.orders AS orders
    WHERE (orders.status = 'completed') AND ((( orders.order_date ) >= ((DATE '2026-01-01')) AND ( orders.order_date ) < ((DATE '2027-01-01'))))
    GROUP BY
        1
    ORDER BY
        1 DESC
  label: grain_drift
  rationale: DATE_TRUNC('WEEK', order_date) is not a declared dimension (only order_date and month are), so grouping by week changes the grain; the permitted query keeps only the 2026 window and has no declared grouping.
  counterpart_sql: |
    SELECT SUM(amount) AS orders_gross_revenue
    FROM main.finance.orders
    WHERE status = 'completed'
      AND order_date >= DATE '2026-01-01' AND order_date < DATE '2027-01-01'
- id: real-14
  metric: gross_revenue
  sql: |
    SELECT country,
           AVG(amount) AS gross_revenue
    FROM main.finance.orders
    WHERE status = 'completed'
    GROUP BY country
  label: formula_drift
  rationale: AVG(amount) is a different aggregation from the declared SUM(amount); population, source and grain are as declared, only the formula changes.
  counterpart_sql: |
    SELECT country,
           SUM(amount) AS gross_revenue
    FROM main.finance.orders
    WHERE status = 'completed'
    GROUP BY country
- id: real-15
  metric: net_revenue
  sql: |
    -- subscription net revenue by month
    SELECT DATE_TRUNC('MONTH', o.order_date) AS month,
           SUM(o.amount) - SUM(o.refund_amount) AS net_revenue
    FROM main.finance.orders o
    WHERE o.status = 'completed'
      AND o.order_id IN (SELECT i.order_id FROM main.finance.order_items i WHERE i.sku LIKE 'SUB-%')
    GROUP BY 1
  label: population_drift
  rationale: The IN-subquery is a semi-join (no fan-out) that keeps only orders with a 'SUB-%' sku line; sku is not a declared dimension, so this filter on another column restricts the population of orders.
  counterpart_sql: |
    SELECT DATE_TRUNC('MONTH', order_date) AS month,
           SUM(amount) - SUM(refund_amount) AS net_revenue
    FROM main.finance.orders
    WHERE status = 'completed'
    GROUP BY 1
- id: real-16
  metric: net_revenue
  sql: |
    with orders as (
        select *
        from main.finance.orders
        qualify row_number() over (partition by order_id order by order_date desc, amount desc) = 1
    ),
    completed as (
        select * from orders where status = 'completed'
    )
    select channel,
           sum(amount) - sum(refund_amount) as net_revenue
    from completed
    group by channel
  label: insufficient_evidence
  rationale: The staging step keeps one row per order_id; that is a no-op if order_id is unique in orders and drops rows (possibly the completed ones) if it is not, and the spec does not state key uniqueness.
  counterpart_sql: |
    SELECT channel,
           SUM(amount) - SUM(refund_amount) AS net_revenue
    FROM main.finance.orders
    WHERE status = 'completed'
    GROUP BY channel
- id: real-17
  metric: net_revenue
  sql: |
    SELECT country,
           SUM(amount) - SUM(refund_amount) AS net_revenue
    FROM main.finance.orders
    WHERE status != 'cancelled'
    GROUP BY country
    ORDER BY net_revenue DESC NULLS LAST, country
  label: population_drift
  rationale: status != 'cancelled' replaces the required filter with a weaker one that admits every non-cancelled status (pending, refunded, etc.), so the population of orders changes.
  counterpart_sql: |
    SELECT country,
           SUM(amount) - SUM(refund_amount) AS net_revenue
    FROM main.finance.orders
    WHERE status = 'completed'
    GROUP BY country
    ORDER BY net_revenue DESC NULLS LAST, country
- id: real-18
  metric: net_revenue
  sql: |
    SELECT
      t3.country AS country,
      t3.a0 - t3.a1 AS net_revenue
    FROM (
      SELECT t2.country AS country, SUM(t2.amount) AS a0, SUM(t2.refund_amount) AS a1
      FROM (
        SELECT t1.country, t1.amount, t1.refund_amount
        FROM (
          SELECT order_id, customer_id, amount, refund_amount, discount, status, country, channel, order_date
          FROM main.finance.orders
        ) AS t1
        WHERE t1.status = 'completed'
      ) AS t2
      GROUP BY t2.country
    ) AS t3
  label: permitted_variation
  rationale: Power BI DirectQuery nests select-project-filter subqueries over orders, keeps status = 'completed', computes SUM(amount) and SUM(refund_amount) per country and subtracts them outside the aggregation; difference of the two sums per group is the declared formula, grouped by the declared country dimension.
  counterpart_sql: |
    SELECT country AS country,
           SUM(amount) - SUM(refund_amount) AS net_revenue
    FROM main.finance.orders
    WHERE status = 'completed'
    GROUP BY country
- id: real-19
  metric: gross_revenue
  sql: |
    SELECT channel,
           SUM(amount - discount) AS gross_revenue
    FROM main.finance.orders
    WHERE status = 'completed'
    GROUP BY channel
  label: formula_drift
  rationale: gross_revenue is SUM(amount); summing amount - discount brings in a column the declared formula does not use and changes the arithmetic.
  counterpart_sql: |
    SELECT channel,
           SUM(amount) AS gross_revenue
    FROM main.finance.orders
    WHERE status = 'completed'
    GROUP BY channel
- id: real-20
  metric: net_revenue
  sql: |
    SELECT MONTH(order_date) AS month,
           SUM(amount) - SUM(refund_amount) AS net_revenue
    FROM main.finance.orders
    WHERE status = 'completed'
      AND order_date >= DATE '2025-01-01' AND order_date < DATE '2027-01-01'
    GROUP BY MONTH(order_date)
    ORDER BY month
  label: grain_drift
  rationale: The column is labelled month but is MONTH(order_date), the month-of-year number, not the declared DATE_TRUNC('MONTH', order_date); across a two-year window it merges e.g. Jan 2025 with Jan 2026, so groups are at a different grain.
  counterpart_sql: |
    SELECT DATE_TRUNC('MONTH', order_date) AS month,
           SUM(amount) - SUM(refund_amount) AS net_revenue
    FROM main.finance.orders
    WHERE status = 'completed'
      AND order_date >= DATE '2025-01-01' AND order_date < DATE '2027-01-01'
    GROUP BY 1
    ORDER BY month
- id: real-21
  metric: net_revenue
  sql: |
    -- FY2025 net revenue trend
    SELECT DATE_TRUNC('MONTH', order_date) AS month,
           SUM(amount) - SUM(refund_amount) AS net_revenue
    FROM main.finance.orders
    WHERE status = 'completed'
      AND YEAR(order_date) = 2025
    GROUP BY 1
    ORDER BY 1
  label: permitted_variation
  rationale: YEAR(order_date) = 2025 is a time window expressed as a function of the declared order_date dimension; grouping is by the declared month expression exactly, and the formula and required filter are unchanged.
  counterpart_sql: |
    SELECT DATE_TRUNC('MONTH', order_date) AS month,
           SUM(amount) - SUM(refund_amount) AS net_revenue
    FROM main.finance.orders
    WHERE status = 'completed'
      AND YEAR(order_date) = 2025
    GROUP BY 1
    ORDER BY 1
- id: real-22
  metric: gross_revenue
  sql: |
    -- top 2 channels per month, H1
    SELECT DATE_TRUNC('MONTH', order_date) AS month,
           channel,
           SUM(amount) AS gross_revenue,
           RANK() OVER (PARTITION BY DATE_TRUNC('MONTH', order_date) ORDER BY SUM(amount) DESC NULLS LAST) AS channel_rank
    FROM main.finance.orders
    WHERE status = 'completed'
      AND order_date >= DATE '2026-01-01' AND order_date < DATE '2026-07-01'
    GROUP BY 1, 2
    QUALIFY channel_rank <= 2
  label: permitted_variation
  rationale: Groups by the declared month and channel dimensions with an H1 window on order_date; RANK over the group values plus QUALIFY only ranks and limits groups, each kept group's SUM(amount) over completed orders is unchanged.
  counterpart_sql: |
    SELECT DATE_TRUNC('MONTH', order_date) AS month,
           channel,
           SUM(amount) AS gross_revenue,
           RANK() OVER (PARTITION BY DATE_TRUNC('MONTH', order_date) ORDER BY SUM(amount) DESC NULLS LAST) AS channel_rank
    FROM main.finance.orders
    WHERE status = 'completed'
      AND order_date >= DATE '2026-01-01' AND order_date < DATE '2026-07-01'
    GROUP BY 1, 2
    QUALIFY channel_rank <= 2
- id: real-23
  metric: net_revenue
  sql: |
    -- sql generated by Looker | explore: revenue | dashboard: Monthly Business Review
    WITH completed_orders AS (SELECT
            order_id,
            country,
            channel,
            order_date,
            amount,
            refund_amount
          FROM main.finance.orders
          WHERE status = 'completed'
          )
    SELECT
        completed_orders.channel  AS completed_orders_channel,
        SUM(completed_orders.amount) - SUM(completed_orders.refund_amount)  AS completed_orders_net_revenue
    FROM completed_orders
    WHERE ((( completed_orders.order_date  ) >= ((DATE '2026-10-01')) AND ( completed_orders.order_date  ) < ((DATE '2026-11-01'))))
    GROUP BY
        1
    ORDER BY
        2 DESC NULLS LAST, 1
    LIMIT 500
  label: permitted_variation
  rationale: Looker derived table is a select-project-filter step over orders that applies status = 'completed'; the outer query adds an October window on order_date (declared), groups by channel (declared), and computes SUM(amount) - SUM(refund_amount) exactly; ORDER BY value then channel is a total order over groups, so the LIMIT only ranks/limits groups without changing any value.
  counterpart_sql: |
    SELECT
        channel AS completed_orders_channel,
        SUM(amount) - SUM(refund_amount) AS completed_orders_net_revenue
    FROM main.finance.orders
    WHERE status = 'completed'
      AND order_date >= DATE '2026-10-01' AND order_date < DATE '2026-11-01'
    GROUP BY 1
    ORDER BY 2 DESC NULLS LAST, 1
    LIMIT 500
- id: real-24
  metric: net_revenue
  sql: |
    with orders as (
        select * from main.finance.orders where status = 'completed'
    ),
    order_net as (
        select order_id, order_date, amount - refund_amount as net_amount
        from orders
    )
    select date_trunc('MONTH', order_date) as month,
           sum(net_amount) as net_revenue
    from order_net
    group by 1
  label: formula_drift
  rationale: 'Row-wise SUM(amount - refund_amount) is not SUM(amount) - SUM(refund_amount): refund_amount is nullable, and every completed order with a NULL refund drops its whole amount from the sum.'
  counterpart_sql: |
    SELECT DATE_TRUNC('MONTH', order_date) AS month,
           SUM(amount) - SUM(refund_amount) AS net_revenue
    FROM main.finance.orders
    WHERE status = 'completed'
    GROUP BY 1
- id: real-25
  metric: gross_revenue
  sql: |
    -- lifetime gross, "fixing" dirty status values
    SELECT SUM(amount) AS gross_revenue
    FROM main.finance.orders
    WHERE LOWER(TRIM(status)) = 'completed'
  label: population_drift
  rationale: LOWER(TRIM(status)) = 'completed' broadens the required filter to also admit 'Completed', ' completed', 'COMPLETED ' and similar values that status = 'completed' excludes, so the population changes whenever such values exist.
  counterpart_sql: |
    SELECT SUM(amount) AS gross_revenue
    FROM main.finance.orders
    WHERE status = 'completed'
- id: real-26
  metric: net_revenue
  sql: |
    SELECT country, channel,
           SUM(amount) - SUM(refund_amount) AS net_revenue
    FROM main.finance.orders
    WHERE status = 'completed'
      AND channel IS NOT NULL
      AND country <> ''
    GROUP BY ALL
    ORDER BY country, channel
  label: permitted_variation
  rationale: GROUP BY ALL resolves to the declared country and channel dimensions; the extra predicates (channel IS NOT NULL, country <> '') only reference declared dimensions, and ORDER BY only orders groups.
  counterpart_sql: |
    SELECT country, channel,
           SUM(amount) - SUM(refund_amount) AS net_revenue
    FROM main.finance.orders
    WHERE status = 'completed'
      AND channel IS NOT NULL
      AND country <> ''
    GROUP BY country, channel
    ORDER BY country, channel
