[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "touchstone"
version = "0.1.1"
description = "Advisory metric drift detection: flags SQL presented as a governed metric but computed differently from its approved definition, with the evidence."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "sqlglot==30.12.0",  # pinned: part of the trusted toolchain (toolchain.py)
    "pyyaml>=6",
]

[project.optional-dependencies]
# Receipt signing (Ed25519). Absent → receipts issue unsigned with a note.
sign = ["cryptography>=42"]
# Execution slice: measure contradiction divergence against seed data.
execute = ["duckdb>=1"]
# Opt-in Databricks integration tests (tests/test_databricks_integration.py):
# MEASURE() runtime behaviour the DuckDB oracle cannot execute.
databricks = ["databricks-sql-connector>=3"]
# The API-key assessment backends: `assess --provider anthropic` (Claude
# through the Anthropic API; `api` is the former name) and `--provider openai`
# (OpenAI, or any compatible server: LiteLLM, vLLM, Groq, Ollama). The
# warehouse backends (databricks, snowflake) need no extra package.
anthropic = ["anthropic>=2"]
openai = ["openai>=1.40"]
api = ["anthropic>=2"]
dev = ["pytest>=8", "ruff>=0.5", "cryptography>=42", "duckdb>=1"]

[project.scripts]
touchstone = "touchstone.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools.package-data]
touchstone = ["benchmark/*.yaml", "benchmark/metric_uses/*.yaml", "benchmark/metric_uses/*.md",
            "assess/schema.json", "assess/criteria/*.yaml"]
